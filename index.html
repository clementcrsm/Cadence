});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('.popover')) return closePopover(); if ($('#picker-root')?.innerHTML) return closePicker(); if ($('#modal-root').innerHTML) return closeModal(); if (S.sideOpen) { S.sideOpen = false; syncPanels(); } return; }
  if (!$('#app') || $('#modal-root').innerHTML || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  const k = e.key.toLowerCase();
  if (k === 'n' && canEdit()) { e.preventDefault(); openPost(null, {}); }
  else if (k === 't') { S.cursor = new Date(); S.sel = todayISO(); renderToolbar(); renderView(); }
  else if (e.key === 'ArrowLeft') shift(-1);
  else if (e.key === 'ArrowRight') shift(1);
  else { const v = VIEWS.find(x => x.key === e.key); if (v) setView(v.id); }
});
window.addEventListener('resize', debounce(() => { if ($('#app')) syncPanels(); }, 150));

</script>
<script>
/* ============================================================
   Cadence V2 : validation, discussion, lien externe, aperçus,
   grille Instagram, médiathèque
   ============================================================ */
const canApprove = () => S.role === 'owner' || !!(S.me && S.me.can_approve);
function valCfg(ws = S.ws){
  const v = (ws && ws.settings && ws.settings.validation) || {};
  const steps = Array.isArray(v.steps) && v.steps.length ? v.steps : [{ name:'Validation' }];
  return { enabled:!!v.enabled, steps };
}
const memberName = id => {
  if (S.user && id === S.user.id) return S.profile?.display_name || 'Toi';
  return (S.members.find(m => m.user_id === id) || {}).display_name || 'Membre';
};
const relTime = s => {
  const d = (Date.now() - new Date(s)) / 1000;
  if (d < 60) return 'à l’instant';
  if (d < 3600) return `il y a ${Math.floor(d / 60)} min`;
  if (d < 86400) return `il y a ${Math.floor(d / 3600)} h`;
  return new Date(s).toLocaleString('fr-FR', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
};
const assetUses = path => S.posts.filter(p => (p.media_paths || []).includes(path));
const linkURL = l => `${location.origin}${location.pathname}?v=${l.token}`;

/* ---------- Visuels ---------- */
async function hydrateMedia(root){
  if (!root || !S.be || !S.be.mediaUrls) return;
  const imgs = $$('img[data-path]:not([data-ok])', root); if (!imgs.length) return;
  const paths = [...new Set(imgs.map(i => i.dataset.path))];
  try {
    const urls = await S.be.mediaUrls(paths);
    imgs.forEach(i => { const u = urls[i.dataset.path]; if (u) { i.src = u; i.dataset.ok = '1'; } else i.classList.add('broken'); });
  } catch (e) {}
}
async function uploadAsset(file){
  const blob = await compressImage(file);
  const path = await S.be.uploadMedia(S.ws.id, blob);
  const a = await S.be.insert('media_assets', {
    workspace_id:S.ws.id, path, name:(file.name || 'Visuel').replace(/\.[^.]+$/, '').slice(0, 120),
    width:blob.w || null, height:blob.h || null, size:blob.size, tags:[]
  });
  S.assets.unshift(a); return a;
}
async function uploadMany(files){
  const out = []; let i = 0;
  for (const f of files) {
    i++;
    try { out.push(await uploadAsset(f)); } catch (e) { toast(`${f.name} : ${errMsg(e)}`, 'err'); }
  }
  return out;
}

/* ---------- Aperçus plateforme ---------- */
const PV_ICONS = {
  heart:'<svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></svg>',
  bubble:'<svg viewBox="0 0 24 24"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3.5 20l1.2-4.1a8.5 8.5 0 1 1 15.8-4.4z"/></svg>',
  send:'<svg viewBox="0 0 24 24"><path d="M21 3.5L10.5 13.5M21 3.5l-6.5 17-4-7-7-4z"/></svg>',
  save:'<svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>'
};
function channelKind(p){
  const c = chan(p.channel), key = `${c.id || ''} ${c.name || ''}`.toLowerCase(), f = (p.format || '').toLowerCase();
  if (/story/.test(f)) return 'story';
  if (/tiktok/.test(key) || /reel|short/.test(f)) return 'vertical';
  if (/insta/.test(key)) return 'ig';
  if (/newsletter|mail/.test(key) || /newsletter/.test(f)) return 'mail';
  if (/site|blog/.test(key) || /article/.test(f)) return 'article';
  if (/youtube/.test(key) || /vid[ée]o/.test(f)) return 'video';
  return 'feed';
}
const richText = t => esc(t).replace(/(^|\s)([#@][\p{L}\p{N}_.]+)/gu, '$1<span class="pv-tag">$2</span>').replace(/\n/g, '<br>');
function clipped(text, n, label){
  const t = text || '';
  if (t.length <= n) return richText(t);
  const cut = t.slice(0, n).replace(/\s+\S*$/, '');
  return `${richText(cut)}<span class="pv-rest" hidden>${richText(t.slice(cut.length))}</span><button type="button" class="pv-more" data-action="pv-more">${label}</button>`;
}
function previewHTML(p, o = {}){
  const kind = channelKind(p), who = o.account || S.profile?.display_name || 'Mon compte';
  const handle = who.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '.').replace(/^\.|\.$/g, '') || 'compte';
  const imgs = p.media_paths || [], ava = `<span class="pv-ava">${esc(initials(who))}</span>`;
  const img = imgs.length ? `<img data-path="${esc(imgs[0])}" alt="">` : `<div class="pv-noimg">${I('image')}<span>Aucun visuel</span></div>`;
  const multi = imgs.length > 1 ? `<div class="pv-dots">${imgs.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div><span class="pv-count">1/${imgs.length}</span>` : '';
  const when = p.pub_date ? fmtShort(p.pub_date) : 'Date à définir';
  const body = p.body || '';
  let h = '';
  if (kind === 'ig') {
    h = `<div class="pv"><div class="pv-head">${ava}<b>${esc(handle)}</b><span class="pv-more3">•••</span></div>
      <div class="pv-media r45">${img}${multi}</div>
      <div class="pv-actions">${PV_ICONS.heart}${PV_ICONS.bubble}${PV_ICONS.send}<span class="r">${PV_ICONS.save}</span></div>
      <div class="pv-cap"><b>${esc(handle)}</b>${clipped(body, 125, 'plus')}</div><div class="pv-date">${esc(when)}</div></div>`;
  } else if (kind === 'vertical') {
    h = `<div class="pv"><div class="pv-vert">${img}<div class="pv-side">${PV_ICONS.heart}${PV_ICONS.bubble}${PV_ICONS.save}${PV_ICONS.send}</div>
      <div class="pv-over"><b>@${esc(handle)}</b><p>${clipped(body, 90, 'plus')}</p></div></div></div>`;
  } else if (kind === 'story') {
    h = `<div class="pv"><div class="pv-vert">${img}<div class="pv-prog"></div><div class="pv-storyhead">${ava}<span>${esc(handle)}</span></div>
      ${p.title && !imgs.length ? `<div class="pv-storytxt">${esc(p.title)}</div>` : ''}</div></div>`;
  } else if (kind === 'mail') {
    const pre = body.split('\n').find(l => l.trim()) || '';
    h = `<div class="pv"><div class="pv-mail"><span class="from">De : ${esc(who)}</span><h4>${esc(p.title || 'Objet de l’email')}</h4><span class="pre">${esc(pre.slice(0, 110))}</span>
      ${imgs.length ? `<div class="pv-media r169">${img}</div>` : ''}<div>${clipped(body, 400, 'Lire la suite')}</div></div></div>`;
  } else if (kind === 'article') {
    h = `<div class="pv pv-art">${imgs.length ? `<div class="pv-media r169">${img}</div>` : ''}<h4>${esc(p.title || 'Titre de l’article')}</h4><div class="pv-text">${clipped(body, 240, 'Lire la suite')}</div></div>`;
  } else if (kind === 'video') {
    h = `<div class="pv pv-yt"><div class="pv-media r169">${img}<div class="pv-play"><span>${PV_ICONS.play}</span></div></div><h4>${esc(p.title || 'Titre de la vidéo')}</h4><small>${esc(who)}</small></div>`;
  } else {
    h = `<div class="pv"><div class="pv-head">${ava}<div><b>${esc(who)}</b><small>${esc(when)}</small></div><span class="pv-more3">•••</span></div>
      <div class="pv-text">${clipped(body, 210, '… voir plus')}</div>
      ${imgs.length ? `<div class="pv-media r43">${img}${multi}</div>` : ''}
      <div class="pv-react"><span>J’aime</span><span>Commenter</span><span>Partager</span></div></div>`;
  }
  return `<div class="pv-wrap">${h}</div>`;
}

/* ---------- Grille ---------- */
function gridChannelId(){
  const chs = S.ws.settings.channels;
  if (S.gridChannel && chs.some(c => c.id === S.gridChannel)) return S.gridChannel;
  const ig = chs.find(c => /insta/i.test(`${c.id} ${c.name}`));
  return (ig || chs[0] || {}).id;
}
function tileHTML(p, today){
  const imgs = p.media_paths || [], future = p.status !== 'publie' && p.pub_date >= today;
  const type = /reel|vid/i.test(p.format || '') ? I('reel') : (imgs.length > 1 || /carrousel/i.test(p.format || '')) ? I('stack') : '';
  return `<button class="tile st-${p.status} ${future ? 'planned' : ''}" data-drag="${p.id}" data-drop="swap" data-id="${p.id}" data-action="open-post" title="${esc((p.title || 'Sans titre') + ', ' + statusName(p.status))}">
    ${imgs.length ? `<img data-path="${esc(imgs[0])}" alt="">` : `<span class="tile-ph">${esc(p.title || 'Sans titre')}</span>`}
    ${type ? `<span class="tile-type">${type}</span>` : ''}
    <span class="tile-date">${p.locked ? I('lock') : ''}${fmtShort(p.pub_date)}</span><span class="tile-st"></span></button>`;
}
function viewGrid(){
  const ch = gridChannelId(), chs = S.ws.settings.channels, today = todayISO();
  const ps = visible().filter(p => p.pub_date && p.channel === ch && !/story/i.test(p.format || ''))
    .sort((a, b) => `${b.pub_date}${b.pub_time || ''}`.localeCompare(`${a.pub_date}${a.pub_time || ''}`));
  const fut = ps.filter(p => p.pub_date >= today && p.status !== 'publie').length;
  return `<div class="gridview">
    <div class="grid-head"><select class="select" data-filter="grid-ch" aria-label="Canal affiché">${chs.map(c => `<option value="${esc(c.id)}" ${c.id === ch ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
      <p class="muted">${ps.length} publication${ps.length > 1 ? 's' : ''}, dont ${fut} à venir (encadrées). La plus récente est en haut à gauche${canEdit() ? '. Glisse une case sur une autre pour échanger leurs dates' : ''}.</p></div>
    ${ps.length ? `<div class="igrid">${ps.map(p => tileHTML(p, today)).join('')}</div>`
      : `<div class="ideas-empty">Aucun contenu daté sur ce canal. Planifie des publications pour voir la grille prendre forme.</div>`}
  </div>`;
}
async function swapPosts(aId, bId){
  if (!aId || !bId || aId === bId) return;
  const a = S.posts.find(x => x.id === aId), b = S.posts.find(x => x.id === bId); if (!a || !b) return;
  if ((a.locked || b.locked) && !canApprove()) return toast(errMsg('contenu_verrouille'), 'err');
  const A = { pub_date:a.pub_date, pub_time:a.pub_time }, B = { pub_date:b.pub_date, pub_time:b.pub_time };
  Object.assign(a, B); Object.assign(b, A); renderAll();
  try { Object.assign(a, await S.be.update('posts', a.id, B)); Object.assign(b, await S.be.update('posts', b.id, A)); toast('Dates échangées'); }
  catch (e) { toast(errMsg(e), 'err'); refreshWs(); }
}

/* ---------- Médiathèque ---------- */
function viewMedia(){
  const q = S.mediaQ.toLowerCase(), tag = S.mediaTag;
  const tags = [...new Set(S.assets.flatMap(a => a.tags || []))].sort((x, y) => x.localeCompare(y, 'fr'));
  const list = S.assets.filter(a => (!q || (a.name || '').toLowerCase().includes(q) || (a.tags || []).some(t => t.toLowerCase().includes(q))) && (!tag || (a.tags || []).includes(tag)));
  return `<div class="mediaview">
    <div class="grid-head">${canEdit() ? `<label class="btn primary">${I('upload')}Importer des visuels<input type="file" accept="image/*" multiple data-upload="library" hidden></label>` : ''}
      <input class="input" type="search" data-filter="media-q" placeholder="Rechercher par nom ou étiquette" value="${esc(S.mediaQ)}" style="max-width:280px" aria-label="Rechercher un visuel">
      ${tags.map(t => `<button class="toggle-chip" data-action="media-tag" data-tag="${esc(t)}" aria-pressed="${tag === t}">${esc(t)}</button>`).join('')}
      <span class="muted" style="font-size:13.5px">${S.assets.length} visuel${S.assets.length > 1 ? 's' : ''}</span></div>
    ${list.length ? `<div class="mgrid">${list.map(a => { const n = assetUses(a.path).length; return `<button class="mtile" data-action="open-asset" data-id="${a.id}"><img data-path="${esc(a.path)}" alt="${esc(a.name)}" loading="lazy"><span class="mt-name">${esc(a.name || 'Sans nom')}</span><span class="mt-meta">${a.width ? `${a.width} × ${a.height}` : 'Image'}${n ? `, utilisé ${n} fois` : ', non utilisé'}</span></button>`; }).join('')}</div>`
      : `<div class="ideas-empty">${S.assets.length ? 'Aucun visuel ne correspond à cette recherche.' : 'La médiathèque rassemble les visuels de l’espace. Importe tes images ici, puis ajoute-les à tes contenus.'}</div>`}
  </div>`;
}
function openAsset(id){
  const a = S.assets.find(x => x.id === id); if (!a) return;
  const uses = assetUses(a.path), ro = !canEdit(), dis = ro ? 'disabled' : '';
  openModal({ title:a.name || 'Visuel', wide:true, body:`<img class="asset-big" data-path="${esc(a.path)}" alt="${esc(a.name)}">
    <label class="field"><span>Nom</span><input class="input" id="as-name" value="${esc(a.name)}" maxlength="120" ${dis}></label>
    <label class="field"><span>Étiquettes (séparées par des virgules)</span><input class="input" id="as-tags" value="${esc((a.tags || []).join(', '))}" placeholder="Ex. salon, portrait, équipe" ${dis}></label>
    <div class="field"><span>Utilisé dans</span>${uses.length ? `<div class="day-list">${uses.map(p => cardHTML(p, { showDate:true })).join('')}</div>` : '<p class="muted" style="margin:0">Aucun contenu pour l’instant.</p>'}</div>
    <p class="meta-line">${a.width ? `${a.width} × ${a.height} px, ` : ''}${a.size ? Math.round(a.size / 1024) + ' Ko, ' : ''}ajouté ${relTime(a.created_at)}</p>`,
  footer:ro ? `<span class="spacer"></span><button class="btn" data-action="close-modal">Fermer</button>` : `<button class="btn ghost danger sm" id="as-del">${I('trash')}Supprimer</button><span class="spacer"></span><button class="btn" data-action="close-modal">Annuler</button><button class="btn primary" id="as-save">Enregistrer</button>`,
  onMount(m){
    hydrateMedia(m);
    $('#as-save', m)?.addEventListener('click', async () => {
      const patch = { name:$('#as-name', m).value.trim(), tags:[...new Set($('#as-tags', m).value.split(',').map(t => t.trim()).filter(Boolean))] };
      try { Object.assign(a, await S.be.update('media_assets', a.id, patch)); closeModal(); renderView(); toast('Visuel enregistré'); } catch (e) { toast(errMsg(e), 'err'); }
    });
    $('#as-del', m)?.addEventListener('click', async () => {
      if (uses.length) return toast(`Ce visuel est utilisé dans ${uses.length} contenu${uses.length > 1 ? 's' : ''}. Retire-le d’abord de ${uses.length > 1 ? 'ces contenus' : 'ce contenu'}.`, 'err');
      if (!confirm('Supprimer définitivement ce visuel ?')) return;
      try { await S.be.remove('media_assets', a.id); await S.be.removeMedia(a.path); S.assets = S.assets.filter(x => x.id !== a.id); closeModal(); renderView(); toast('Visuel supprimé'); }
      catch (e) { toast(errMsg(e), 'err'); }
    });
  } });
}
function openPicker(onPick, already = []){
  const root = $('#picker-root'), sel = new Set();
  const draw = () => {
    root.innerHTML = `<div class="scrim" style="z-index:300" data-pick="close"></div><div class="modal wide picker" style="z-index:301" role="dialog" aria-modal="true" aria-label="Choisir des visuels">
      <header><h2>Choisir des visuels</h2><button class="icon-btn" data-pick="close" aria-label="Fermer">${I('x')}</button></header>
      <div class="modal-body">${canEdit() ? `<label class="btn" style="justify-self:start">${I('upload')}Importer depuis l’appareil<input type="file" accept="image/*" multiple hidden id="pick-up"></label>` : ''}
        ${S.assets.length ? `<div class="mgrid sm">${S.assets.map(a => `<button class="mtile ${sel.has(a.path) ? 'picked' : ''}" data-pick="toggle" data-path="${esc(a.path)}" aria-pressed="${sel.has(a.path)}"><img data-path="${esc(a.path)}" alt=""><span class="mt-name">${esc(a.name || 'Sans nom')}</span>${already.includes(a.path) ? '<span class="mt-meta">Déjà dans ce contenu</span>' : ''}</button>`).join('')}</div>`
          : '<p class="muted">La médiathèque est vide. Importe une image pour commencer.</p>'}</div>
      <footer><span class="muted" style="font-size:14px">${sel.size} sélectionné${sel.size > 1 ? 's' : ''}</span><span class="spacer"></span><button class="btn" data-pick="close">Annuler</button><button class="btn primary" data-pick="ok" ${sel.size ? '' : 'disabled'}>Ajouter</button></footer></div>`;
    hydrateMedia(root);
    $('#pick-up', root)?.addEventListener('change', async e => { const got = await uploadMany([...e.target.files]); got.forEach(a => sel.add(a.path)); draw(); });
  };
  root.onclick = e => {
    const b = e.target.closest('[data-pick]'); if (!b) return;
    const k = b.dataset.pick;
    if (k === 'close') closePicker();
    else if (k === 'toggle') { const p = b.dataset.path; sel.has(p) ? sel.delete(p) : sel.add(p); draw(); }
    else if (k === 'ok') { const list = [...sel]; closePicker(); onPick(list); }
  };
  draw();
}
function closePicker(){ const r = $('#picker-root'); if (r) { r.innerHTML = ''; r.onclick = null; } }

/* ---------- Historique ---------- */
function eventText(ev){
  const d = ev.detail || {};
  if (ev.kind === 'created') return 'a créé le contenu';
  const parts = [];
  if (d.status) parts.push(`a changé le statut de ${statusName(d.status[0])} à ${statusName(d.status[1])}`);
  if (d.date) parts.push(d.date[2] ? `a planifié au ${fmtShort(d.date[2])}${d.date[3] ? ' à ' + fmtTime(d.date[3]) : ''}` : 'a renvoyé le contenu dans la boîte à idées');
  if (d.locked === true) parts.push('a verrouillé le contenu');
  if (d.locked === false) parts.push('a déverrouillé le contenu');
  if (d.content) parts.push('a modifié le contenu');
  return parts.join(', ') || 'a modifié le contenu';
}
function timelineHTML(th){
  const items = [
    ...th.comments.map(c => ({ t:c.created_at, h:`<div class="tl-item ${c.user_id ? '' : 'ext'}"><span class="ava">${esc(initials(c.author_name || memberName(c.user_id)))}</span><div style="flex:1;min-width:0"><div class="tl-head"><b>${esc(c.author_name || memberName(c.user_id))}</b><small>${relTime(c.created_at)}</small>${(S.user && c.user_id === S.user.id) || isOwner() ? `<button class="tl-del" data-del-comment="${c.id}" aria-label="Supprimer ce commentaire">${I('x')}</button>` : ''}</div><p>${esc(c.body).replace(/\n/g, '<br>')}</p></div></div>` })),
    ...th.reviews.map(r => ({ t:r.created_at, h:`<div class="tl-item review ${r.decision}"><span class="tl-ico">${r.decision === 'approved' ? I('check') : I('chat')}</span><div><div class="tl-head"><b>${esc(r.actor_name || memberName(r.user_id))}</b><small>${relTime(r.created_at)}</small></div><p>${r.decision === 'approved' ? `a approuvé l’étape ${r.step}` : 'a demandé des modifications'}${r.comment ? ` : « ${esc(r.comment)} »` : ''}</p></div></div>` })),
    ...th.events.map(ev => ({ t:ev.created_at, h:`<div class="tl-item event"><span class="tl-dot"></span><p><b>${esc(ev.actor_name || memberName(ev.user_id))}</b> ${eventText(ev)} <small>${relTime(ev.created_at)}</small></p></div>` }))
  ].sort((a, b) => a.t.localeCompare(b.t));
  return items.length ? `<div class="timeline">${items.map(i => i.h).join('')}</div>` : '<p class="muted">Aucune activité pour l’instant.</p>';
}
async function reloadThread(){
  const pm = S.postModal; if (!pm || !S.openPostId) return;
  try { pm.st.thread = await S.be.loadThread(S.openPostId); pm.redraw(); } catch (e) {}
}

/* ---------- Fiche contenu (V2) ---------- */
function openPost(id, preset = {}){
  const existing = id ? S.posts.find(x => x.id === id) : null;
  if (id && !existing) return;
  const chs = S.ws.settings.channels, fmts = S.ws.settings.formats || [], vc = valCfg(), approver = canApprove();
  const p = existing || { title:'', body:'', channel:chs[0]?.id || null, format:fmts[0] || null, status:preset.date ? 'redaction' : 'idee', pub_date:preset.date || null, pub_time:null, labels:[], campaign_id:S.filters.campaign || null, media_paths:[], link:'', notes:'', locked:false, review_cycle:0 };
  const ro = !canEdit() || (p.locked && !approver), dis = ro ? 'disabled' : '';
  const st = { labels:[...(p.labels || [])], status:p.status, channel:p.channel, media:[...(p.media_paths || [])], tab:preset.tab || 'content', thread:null };
  const stDisabled = sid => ro || (vc.enabled && !approver && ['programme','publie'].includes(sid) && !['programme','publie'].includes(p.status));
  S.openPostId = existing ? existing.id : null;
  const body = `
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-ptab="content" aria-selected="${st.tab === 'content'}">Contenu</button>
      <button type="button" role="tab" data-ptab="preview" aria-selected="${st.tab === 'preview'}">Aperçu</button>
      <button type="button" role="tab" data-ptab="thread" aria-selected="${st.tab === 'thread'}">Discussion<span class="tabcount" id="tcount"></span></button>
    </div>
    <div data-pane="content" ${st.tab === 'content' ? '' : 'hidden'}>
      <div id="valbox"></div>
      <form id="post-form" style="display:grid;gap:16px" autocomplete="off">
        <label class="field"><span>Titre</span><input class="input" name="title" value="${esc(p.title)}" placeholder="Ex. Coulisses du shooting de lancement" ${dis} maxlength="200"></label>
        <div class="field"><span>Statut</span><div class="status-pick" role="radiogroup" aria-label="Statut">${STATUSES.map(s => `<button type="button" class="toggle-chip st-${s.id}" data-st="${s.id}" role="radio" aria-pressed="${st.status === s.id}" aria-checked="${st.status === s.id}" ${stDisabled(s.id) ? 'disabled' : ''}><span class="dot"></span>${s.name}</button>`).join('')}</div>
          ${vc.enabled && !approver && !ro ? '<p class="meta-line" style="margin:0">Programmé et Publié se débloquent après validation.</p>' : ''}</div>
        <div class="field"><span>Canal</span><div class="chan-pick" role="radiogroup" aria-label="Canal">${chs.map(c => `<button type="button" class="toggle-chip" style="--c:${esc(c.color)}" data-ch="${esc(c.id)}" role="radio" aria-pressed="${st.channel === c.id}" aria-checked="${st.channel === c.id}" ${dis}><span class="dot"></span>${esc(c.name)}</button>`).join('')}</div></div>
        <div class="grid2">
          <label class="field"><span>Format</span><select class="select" name="format" ${dis}><option value="">Aucun</option>${fmts.map(f => `<option ${p.format === f ? 'selected' : ''}>${esc(f)}</option>`).join('')}${p.format && !fmts.includes(p.format) ? `<option selected>${esc(p.format)}</option>` : ''}</select></label>
          <label class="field"><span>Campagne</span><select class="select" name="campaign_id" ${dis}><option value="">Aucune</option>${S.campaigns.map(c => `<option value="${c.id}" ${p.campaign_id === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
        </div>
        <div class="grid2">
          <label class="field"><span>Date de publication</span><input class="input" type="date" name="pub_date" value="${p.pub_date || ''}" ${dis}></label>
          <label class="field"><span>Heure</span><input class="input" type="time" name="pub_time" value="${p.pub_time ? p.pub_time.slice(0, 5) : ''}" ${dis}></label>
        </div>
        <p class="meta-line" style="margin:-8px 0 0">Sans date, le contenu reste dans la boîte à idées.</p>
        <div class="field"><span>Étiquettes</span><div class="tags" id="tags"></div><datalist id="label-list">${allLabels().map(l => `<option value="${esc(l)}">`).join('')}</datalist></div>
        <label class="field"><span>Texte de la publication</span><textarea class="textarea" name="body" placeholder="Légende, accroche, hashtags…" ${dis}>${esc(p.body || '')}</textarea></label>
        <div class="counter" id="counter"></div>
        <div class="field"><span>Visuels${st.media.length > 1 ? ' (le premier sert de couverture)' : ''}</span><div class="gallery" id="gallery"></div></div>
        <label class="field"><span>Lien</span><input class="input" type="url" name="link" value="${esc(p.link || '')}" placeholder="https://" ${dis} inputmode="url"></label>
        <label class="field"><span>Notes internes</span><textarea class="textarea" name="notes" style="min-height:80px" placeholder="Brief, idées de visuels, contraintes…" ${dis}>${esc(p.notes || '')}</textarea></label>
        ${existing ? `<p class="meta-line">Créé le ${new Date(p.created_at).toLocaleDateString('fr-FR')}${p.created_by ? ' par ' + esc(memberName(p.created_by)) : ''}${p.updated_at ? ', modifié le ' + new Date(p.updated_at).toLocaleDateString('fr-FR') : ''}</p>` : ''}
      </form>
    </div>
    <div data-pane="preview" ${st.tab === 'preview' ? '' : 'hidden'}><p class="meta-line" style="margin:0">Aperçu indicatif selon le canal et le format choisis. Le rendu réel dépend de l’application.</p><div id="pv-box"></div></div>
    <div data-pane="thread" ${st.tab === 'thread' ? '' : 'hidden'}>
      <div id="thread-box"></div>
      ${existing ? `<div class="field"><textarea class="textarea" id="cm-body" placeholder="Écrire un commentaire" style="min-height:80px" maxlength="2000"></textarea>
        <div class="row"><button type="button" class="btn primary sm" id="cm-send">${I('chat')}Commenter</button><span class="meta-line">Les personnes externes ne voient pas les commentaires internes.</span></div></div>` : ''}
    </div>`;
  const footer = `${existing && canEdit() && !(p.locked && !approver) ? `<button class="btn ghost danger sm" id="post-del" title="Supprimer" aria-label="Supprimer">${I('trash')}Supprimer</button><button class="btn ghost sm" id="post-dup" title="Dupliquer" aria-label="Dupliquer">${I('copy')}Dupliquer</button>` : ''}
    ${existing && canEdit() ? `<button class="btn ghost sm" id="post-share" title="Lien de validation" aria-label="Lien de validation">${I('share')}Lien de validation</button>` : ''}
    ${existing && approver && !p.locked ? `<button class="btn ghost sm" id="post-lock" title="Verrouiller" aria-label="Verrouiller">${I('lock')}Verrouiller</button>` : ''}
    <span class="spacer"></span>${ro ? `<button class="btn" data-action="close-modal">Fermer</button>` : `<button class="btn" data-action="close-modal">Annuler</button><button class="btn primary" id="post-save">${existing ? 'Enregistrer' : 'Créer le contenu'}</button>`}`;
  openModal({ title:existing ? (ro ? 'Contenu' : 'Modifier le contenu') : 'Nouveau contenu', wide:true, body, footer, onMount(m){
    const form = $('#post-form', m);
    const cur = () => (existing && S.posts.find(x => x.id === existing.id)) || p;
    const formPost = () => {
      const f = new FormData(form);
      return { ...p, title:(f.get('title') ?? p.title) || '', body:f.get('body') ?? p.body, channel:st.channel, format:f.get('format') ?? p.format, pub_date:f.get('pub_date') ?? p.pub_date, pub_time:f.get('pub_time') ?? p.pub_time, media_paths:st.media };
    };
    /* étiquettes */
    const drawTags = () => {
      $('#tags', m).innerHTML = st.labels.map((l, i) => `<span class="tag">${esc(l)}${ro ? '' : `<button type="button" data-rm="${i}" aria-label="Retirer ${esc(l)}">${I('x')}</button>`}</span>`).join('')
        + (ro ? '' : `<input list="label-list" id="tag-in" placeholder="${st.labels.length ? '' : 'Ajouter une étiquette puis Entrée'}" aria-label="Nouvelle étiquette">`);
      const tin = $('#tag-in', m); if (!tin) return;
      const add = () => { const v = tin.value.trim().replace(/,$/, ''); if (v && !st.labels.includes(v)) st.labels.push(v); tin.value = ''; drawTags(); $('#tag-in', m).focus(); };
      tin.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(); } else if (e.key === 'Backspace' && !tin.value && st.labels.length) { st.labels.pop(); drawTags(); $('#tag-in', m).focus(); } });
      tin.addEventListener('change', () => { if (tin.value.trim()) add(); });
    };
    drawTags();
    $('#tags', m).addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (b) { st.labels.splice(+b.dataset.rm, 1); drawTags(); } });
    /* compteur */
    const count = () => {
      const n = form.body.value.length, c = chan(st.channel), lim = CHAR_LIMITS[(c.id || '').toLowerCase()] || CHAR_LIMITS[(c.name || '').toLowerCase()];
      const el = $('#counter', m); el.textContent = lim ? `${n} / ${lim} caractères pour ${c.name}` : `${n} caractères`; el.classList.toggle('over', !!lim && n > lim);
    };
    form.body.addEventListener('input', count); count();
    $$('[data-st]', m).forEach(b => b.addEventListener('click', () => { st.status = b.dataset.st; $$('[data-st]', m).forEach(x => { x.setAttribute('aria-pressed', x === b); x.setAttribute('aria-checked', x === b); }); }));
    $$('[data-ch]', m).forEach(b => b.addEventListener('click', () => { st.channel = st.channel === b.dataset.ch ? null : b.dataset.ch; $$('[data-ch]', m).forEach(x => { const on = x.dataset.ch === st.channel; x.setAttribute('aria-pressed', on); x.setAttribute('aria-checked', on); }); count(); }));
    /* visuels */
    const drawGallery = () => {
      $('#gallery', m).innerHTML = st.media.map((path, i) => `<div class="gthumb"><img data-path="${esc(path)}" alt="Visuel ${i + 1}"><span class="gidx">${i + 1}</span>
        ${ro ? '' : `<div class="gtools">${i ? `<button type="button" data-gm="left" data-i="${i}" aria-label="Déplacer avant">${I('left')}</button>` : '<span></span>'}<button type="button" data-gm="rm" data-i="${i}" aria-label="Retirer ce visuel">${I('x')}</button></div>`}</div>`).join('')
        + (ro ? (st.media.length ? '' : '<p class="muted" style="margin:0">Aucun visuel.</p>')
          : `<label class="gadd">${I('upload')}<span>Importer</span><input type="file" accept="image/*" multiple hidden id="g-up"></label><button type="button" class="gadd" id="g-lib">${I('image')}<span>Médiathèque</span></button>`);
      hydrateMedia($('#gallery', m));
      $('#g-up', m)?.addEventListener('change', async e => { const got = await uploadMany([...e.target.files]); got.forEach(a => st.media.push(a.path)); drawGallery(); });
      $('#g-lib', m)?.addEventListener('click', () => openPicker(list => { list.forEach(pth => { if (!st.media.includes(pth)) st.media.push(pth); }); drawGallery(); }, st.media));
    };
    drawGallery();
    $('#gallery', m).addEventListener('click', e => {
      const b = e.target.closest('[data-gm]'); if (!b) return; const i = +b.dataset.i;
      if (b.dataset.gm === 'rm') st.media.splice(i, 1);
      if (b.dataset.gm === 'left' && i > 0) [st.media[i - 1], st.media[i]] = [st.media[i], st.media[i - 1]];
      drawGallery();
    });
    /* validation */
    const drawVal = () => {
      const box = $('#valbox', m); if (!existing) { box.innerHTML = ''; return; }
      const c = cur(), reviews = (st.thread?.reviews || []).filter(r => r.cycle === c.review_cycle);
      let h = '';
      if (c.locked) {
        const last = (st.thread?.reviews || []).filter(r => r.decision === 'approved').slice(-1)[0];
        h = `<div class="valbox locked">${I('lock')}<div><b>Contenu verrouillé</b><span>${last ? `Validé par ${esc(last.actor_name || memberName(last.user_id))}, ${relTime(last.created_at)}.` : 'Verrouillé par un approbateur.'} ${approver ? 'Déverrouille pour le modifier : il repassera en rédaction.' : 'Seul un approbateur peut le modifier.'}</span></div>
          ${approver ? `<button class="btn sm" data-v="unlock">${I('unlock')}Déverrouiller</button>` : (canEdit() && c.status === 'programme' ? `<button class="btn sm" data-v="published">Marquer comme publié</button>` : '')}</div>`;
      } else if (vc.enabled && c.status === 'a_valider') {
        const okN = reviews.filter(r => r.decision === 'approved').length;
        h = `<div class="valbox review"><b>Validation en cours : étape ${Math.min(okN + 1, vc.steps.length)} sur ${vc.steps.length}</b>
          <ol class="steps">${vc.steps.map((s, i) => { const r = reviews.find(x => x.step === i + 1 && x.decision === 'approved'); const now = !r && okN === i;
            return `<li class="${r ? 'ok' : now ? 'cur' : ''}"><span class="n">${r ? I('check') : i + 1}</span><span><b>${esc(s.name || 'Étape ' + (i + 1))}</b><small>${r ? `Approuvée par ${esc(r.actor_name || memberName(r.user_id))}, ${relTime(r.created_at)}` : now ? 'En attente' : 'À venir'}</small></span></li>`; }).join('')}</ol>
          ${approver ? `<textarea class="textarea" id="val-comment" placeholder="Commentaire (obligatoire pour demander des modifications)" style="min-height:70px" maxlength="2000"></textarea>
            <div class="row wrap"><button type="button" class="btn primary sm" data-v="approved">${I('check')}Approuver l’étape</button><button type="button" class="btn sm" data-v="changes">Demander des modifications</button></div>`
            : '<span class="muted" style="font-size:13.5px">En attente d’un approbateur. Tu seras prévenu dans la discussion.</span>'}</div>`;
      } else if (vc.enabled && canEdit() && ['idee','redaction'].includes(c.status)) {
        const last = (st.thread?.reviews || []).filter(r => r.decision === 'changes').slice(-1)[0];
        h = `<div class="valbox">${I('send')}<div><b>Circuit de validation : ${vc.steps.length} étape${vc.steps.length > 1 ? 's' : ''}</b><span>${last ? `Modifications demandées par ${esc(last.actor_name || memberName(last.user_id))} : « ${esc(last.comment || '')} »` : 'Envoie ce contenu quand il est prêt à être relu. Tes modifications en cours seront enregistrées.'}</span></div>
          <button type="button" class="btn primary sm" data-v="submit">Envoyer en validation</button></div>`;
      }
      box.innerHTML = h;
    };
    const drawThread = () => {
      const tb = $('#thread-box', m); if (!tb) return;
      if (!existing) { tb.innerHTML = '<p class="muted">Enregistre d’abord le contenu pour ouvrir la discussion.</p>'; return; }
      tb.innerHTML = st.thread ? timelineHTML(st.thread) : '<p class="muted">Chargement…</p>';
      $('#tcount', m).textContent = st.thread && st.thread.comments.length ? st.thread.comments.length : '';
    };
    const drawPreview = () => { const box = $('#pv-box', m); box.innerHTML = previewHTML(formPost()); hydrateMedia(box); };
    S.postModal = { st, redraw:() => { drawVal(); drawThread(); } };
    drawVal(); drawThread(); if (st.tab === 'preview') drawPreview();
    if (existing) S.be.loadThread(existing.id).then(th => { st.thread = th; drawVal(); drawThread(); }).catch(() => {});
    /* onglets */
    $$('[data-ptab]', m).forEach(b => b.addEventListener('click', () => {
      st.tab = b.dataset.ptab;
      $$('[data-ptab]', m).forEach(x => x.setAttribute('aria-selected', x === b));
      $$('[data-pane]', m).forEach(x => x.hidden = x.dataset.pane !== st.tab);
      if (st.tab === 'preview') drawPreview();
      if (st.tab === 'thread') $('#cm-body', m)?.focus();
    }));
    /* discussion */
    $('#cm-send', m)?.addEventListener('click', async () => {
      const ta = $('#cm-body', m), txt = ta.value.trim(); if (!txt) return;
      try { await S.be.addComment(S.ws.id, existing.id, txt); ta.value = ''; await reloadThread(); } catch (e) { toast(errMsg(e), 'err'); }
    });
    $('#thread-box', m)?.addEventListener('click', async e => {
      const b = e.target.closest('[data-del-comment]'); if (!b || !confirm('Supprimer ce commentaire ?')) return;
      try { await S.be.remove('post_comments', b.dataset.delComment); await reloadThread(); } catch (err) { toast(errMsg(err), 'err'); }
    });
    /* enregistrement */
    const buildRow = () => {
      const f = new FormData(form);
      const row = {
        title:(f.get('title') || '').trim(), body:f.get('body') || '', channel:st.channel, format:f.get('format') || null, status:st.status,
        pub_date:f.get('pub_date') || null, pub_time:f.get('pub_time') || null, labels:st.labels, campaign_id:f.get('campaign_id') || null,
        link:(f.get('link') || '').trim() || null, notes:f.get('notes') || null, media_paths:st.media, media_path:st.media[0] || null
      };
      if (!row.pub_date) row.pub_time = null;
      return row;
    };
    const save = async (extra = {}, msg) => {
      const btn = $('#post-save', m); if (btn) btn.disabled = true;
      try {
        const row = { ...buildRow(), ...extra };
        let r;
        if (existing) { r = await S.be.update('posts', existing.id, row); Object.assign(existing, r); }
        else { r = await S.be.insert('posts', { ...row, workspace_id:S.ws.id }); S.posts.push(r); }
        closeModal(); renderAll();
        toast(msg || (existing ? 'Contenu enregistré' : (row.pub_date ? `Contenu planifié le ${fmtShort(row.pub_date)}` : 'Idée ajoutée à la boîte à idées')));
      } catch (e) { toast(errMsg(e), 'err'); if (btn) btn.disabled = false; }
    };
    $('#post-save', m)?.addEventListener('click', () => save());
    form.addEventListener('submit', e => { e.preventDefault(); if (!ro) save(); });
    form.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && !ro) { e.preventDefault(); save(); } });
    /* actions de validation */
    const after = async (msg) => { toast(msg); await refreshWs(); openPost(existing.id, { tab:st.tab }); };
    $('#valbox', m).addEventListener('click', async e => {
      const b = e.target.closest('[data-v]'); if (!b) return; const v = b.dataset.v, c = cur();
      try {
        if (v === 'submit') return save({ status:'a_valider', review_cycle:(c.review_cycle || 0) + 1 }, 'Envoyé en validation');
        if (v === 'approved' || v === 'changes') {
          b.disabled = true;
          const r = await S.be.approvePost(c.id, v, $('#val-comment', m)?.value || '');
          return after(r.result === 'validated' ? 'Contenu validé et verrouillé' : r.result === 'changes' ? 'Modifications demandées' : `Étape ${r.step} approuvée`);
        }
        if (v === 'unlock') { await S.be.setLock(c.id, false); return after('Contenu déverrouillé, repassé en rédaction'); }
        if (v === 'published') { await S.be.update('posts', c.id, { status:'publie' }); return after('Marqué comme publié'); }
      } catch (err) { b.disabled = false; toast(errMsg(err), 'err'); }
    });
    $('#post-lock', m)?.addEventListener('click', async () => { try { await S.be.setLock(existing.id, true); await after('Contenu verrouillé'); } catch (e) { toast(errMsg(e), 'err'); } });
    $('#post-share', m)?.addEventListener('click', () => openShare({ post_id:existing.id }));
    $('#post-del', m)?.addEventListener('click', async () => {
      if (!confirm('Supprimer ce contenu ? Ses visuels restent dans la médiathèque.')) return;
      try { await S.be.remove('posts', existing.id); S.posts = S.posts.filter(x => x.id !== existing.id); closeModal(); renderAll(); toast('Contenu supprimé'); }
      catch (e) { toast(errMsg(e), 'err'); }
    });
    $('#post-dup', m)?.addEventListener('click', async () => {
      try {
        const { id:_i, created_at:_c, updated_at:_u, created_by:_b, ...rest } = existing;
        const r = await S.be.insert('posts', { ...rest, title:(existing.title || 'Sans titre') + ' (copie)', status:'redaction', locked:false, review_cycle:0 });
        S.posts.push(r); renderAll(); toast('Contenu dupliqué'); openPost(r.id);
      } catch (e) { toast(errMsg(e), 'err'); }
    });
  } });
}

/* ---------- Liens de validation ---------- */
function linkScope(l){
  if (l.post_id) { const p = S.posts.find(x => x.id === l.post_id); return `Contenu : ${p ? (p.title || 'Sans titre') : 'supprimé'}`; }
  if (l.campaign_id) { const c = S.campaigns.find(x => x.id === l.campaign_id); return `Campagne : ${c ? c.name : 'supprimée'}`; }
  return `Du ${fmtShort(l.start_date)} au ${fmtShort(l.end_date)}`;
}
const linkActive = l => !l.revoked && (!l.expires_at || new Date(l.expires_at) > new Date());
function openShare(scope = {}){
  if (S.be.kind === 'local') return toast('Les liens de validation nécessitent la version en ligne.', 'err');
  const post = scope.post_id && S.posts.find(p => p.id === scope.post_id), camp = scope.campaign_id && S.campaigns.find(c => c.id === scope.campaign_id);
  const a = iso(startOfWeek(new Date())), b = iso(addDays(startOfWeek(new Date()), 13));
  const label = post ? (post.title || 'Contenu') : camp ? camp.name : 'Contenus à valider';
  openModal({ title:'Lien de validation', body:`<form id="sh-form" style="display:grid;gap:16px">
    <p class="note" style="margin:0">La personne n’a pas besoin de compte. Elle voit les aperçus, peut commenter et, si tu l’autorises, valider. Elle ne voit ni vos commentaires internes ni le reste de l’espace.</p>
    <label class="field"><span>Titre affiché</span><input class="input" name="label" value="${esc(label)}" maxlength="100"></label>
    ${post ? `<p class="muted" style="margin:0">Contient : ${esc(post.title || 'ce contenu')}</p>` : camp ? `<p class="muted" style="margin:0">Contient tous les contenus de la campagne « ${esc(camp.name)} », y compris ceux ajoutés plus tard.</p>`
      : `<div class="grid2"><label class="field"><span>Du</span><input class="input" type="date" name="start" value="${a}" required></label><label class="field"><span>Au</span><input class="input" type="date" name="end" value="${b}" required></label></div>`}
    <label class="field"><span>Durée de validité</span><select class="select" name="exp"><option value="7">7 jours</option><option value="30" selected>30 jours</option><option value="90">90 jours</option><option value="0">Sans limite</option></select></label>
    <label class="check"><input type="checkbox" name="decide" checked><span>Autoriser la validation (sinon, commentaires uniquement)</span></label>
  </form><div id="sh-out"></div>`,
  footer:`<span class="spacer"></span><button class="btn" data-action="close-modal">Fermer</button><button class="btn primary" id="sh-go">${I('share')}Créer le lien</button>`,
  onMount(m){
    $('#sh-go', m).addEventListener('click', async () => {
      const f = new FormData($('#sh-form', m)), exp = +f.get('exp');
      const row = { workspace_id:S.ws.id, label:(f.get('label') || '').trim() || label, allow_decision:!!f.get('decide'), expires_at:exp ? new Date(Date.now() + exp * 864e5).toISOString() : null };
      if (post) row.post_id = post.id; else if (camp) row.campaign_id = camp.id;
      else { row.start_date = f.get('start'); row.end_date = f.get('end'); if (!row.start_date || !row.end_date || row.end_date < row.start_date) return toast('Choisis une période valide.', 'err'); }
      try {
        const l = await S.be.insert('share_links', row); S.links.unshift(l);
        $('#sh-form', m).hidden = true; $('#sh-go', m).remove();
        $('#sh-out', m).innerHTML = `<div class="field"><span>Lien à envoyer</span><div class="code-box"><input class="input" value="${esc(linkURL(l))}" readonly id="sh-url" style="flex:1"><button class="btn sm" id="sh-copy">${I('copy')}Copier</button></div>
          <p class="meta-line" style="margin:0">Tu peux le désactiver à tout moment dans les réglages de l’espace, onglet Liens de validation.</p><a class="link" href="${esc(linkURL(l))}" target="_blank" rel="noopener">Ouvrir la page de validation</a></div>`;
        $('#sh-copy', m).addEventListener('click', () => navigator.clipboard?.writeText(linkURL(l)).then(() => toast('Lien copié'), () => { $('#sh-url', m).select(); toast('Copie impossible : sélectionne le lien et copie-le.', 'err'); }));
      } catch (e) { toast(errMsg(e), 'err'); }
    });
  } });
}

/* ---------- Réglages d'espace (V2) ---------- */
async function openWsSettings(tab = 'general'){
  const w = S.ws, owner = isOwner(), vc = valCfg();
  const tabs = [['general', 'Général'], ...(w.kind === 'team' ? [['members', 'Membres']] : []), ['validation', 'Validation'], ['links', 'Liens de validation'], ['channels', 'Canaux et formats'], ['alternance', 'Calque alternance']];
  const counts = ALT_TYPES.map(t => ({ ...t, n:[...S.marks.values()].filter(v => v === t.id).length })).filter(t => t.n);
  const panes = {
    general:`<label class="field"><span>Nom de l’espace</span><div class="row"><input class="input" id="ws-name" value="${esc(w.name)}" ${owner ? '' : 'disabled'} maxlength="80">${owner ? '<button class="btn" id="ws-rename">Renommer</button>' : ''}</div></label>
      ${w.kind === 'team' ? `<div class="field"><span>Code d’invitation</span><div class="code-box"><b>${esc(w.invite_code || '')}</b><button class="btn sm" id="ws-copy">${I('copy')}Copier</button></div>
        <p class="meta-line" style="margin:0">Partage ce code avec ta classe : chacun le saisit dans « Rejoindre avec un code ».</p></div>` : `<p class="note">Ton espace personnel est privé. Pour travailler à plusieurs, crée un espace d’équipe depuis le sélecteur d’espaces.</p>`}
      ${w.kind === 'team' ? (owner ? `<button class="btn danger" id="ws-delete" style="justify-self:start">${I('trash')}Supprimer l’espace et ses contenus</button>` : `<button class="btn danger" id="ws-leave" style="justify-self:start">${I('logout')}Quitter l’espace</button>`) : ''}`,
    members:`<div id="members"><p class="muted">Chargement des membres…</p></div>
      <p class="note">Propriétaire : gère l’espace. Éditeur : crée et modifie les contenus. Lecteur : consulte et commente. Approbateur : valide les contenus, quel que soit son rôle (un lecteur approbateur convient bien à un enseignant ou un tuteur).</p>`,
    validation:`<p class="muted" style="margin:0">Quand le circuit est actif, un contenu passe par chaque étape avant d’être programmé. Chaque étape demande l’accord d’un approbateur, et un contenu validé est verrouillé.</p>
      <label class="check"><input type="checkbox" id="val-on" ${vc.enabled ? 'checked' : ''} ${owner ? '' : 'disabled'}><span>Activer le circuit de validation dans cet espace</span></label>
      <div class="field"><span>Étapes (dans l’ordre)</span><div class="editable-list" id="val-steps"></div>${owner ? `<button class="btn ghost sm" id="val-add" style="justify-self:start">${I('plus')}Ajouter une étape</button>` : ''}</div>
      ${owner ? '<button class="btn primary" id="val-save" style="justify-self:start">Enregistrer le circuit</button>' : '<p class="note">Seul le propriétaire modifie le circuit de validation.</p>'}
      <p class="meta-line" style="margin:0">Approbateurs actuels : ${esc(S.members.filter(x => x.role === 'owner' || x.can_approve).map(x => x.display_name).join(', ') || 'le propriétaire')}. ${w.kind === 'team' ? 'Tu les choisis dans l’onglet Membres.' : ''}</p>`,
    links:S.be.kind === 'local' ? '<p class="note">Les liens de validation nécessitent la version en ligne.</p>' : `<p class="muted" style="margin:0">Liens envoyés à des personnes sans compte (tuteur, client, jury) pour relire et valider des contenus.</p>
      ${canEdit() ? `<button class="btn primary" id="lk-new" style="justify-self:start">${I('share')}Nouveau lien pour une période</button>` : ''}
      <div class="links-list">${S.links.length ? S.links.map(l => `<div class="link-row ${linkActive(l) ? '' : 'off'}"><b>${esc(l.label || 'Lien')}</b><small>${esc(linkScope(l))}, ${l.revoked ? 'désactivé' : l.expires_at ? (linkActive(l) ? 'jusqu’au ' : 'expiré le ') + new Date(l.expires_at).toLocaleDateString('fr-FR') : 'sans limite'}${l.allow_decision ? '' : ', commentaires seulement'}</small>
        <div class="row">${linkActive(l) ? `<button class="btn sm" data-lk-copy="${l.id}">${I('copy')}Copier</button>${canEdit() ? `<button class="btn ghost sm danger" data-lk-off="${l.id}">Désactiver</button>` : ''}` : ''}</div></div>`).join('') : '<p class="note">Aucun lien pour l’instant. Crée-en un depuis un contenu, une campagne, ou pour une période.</p>'}</div>`,
    channels:`${owner ? '' : '<p class="note">Seul le propriétaire de l’espace modifie les canaux et les formats.</p>'}
      <div class="field"><span>Canaux</span><div class="editable-list" id="ch-list"></div>${owner ? `<button class="btn ghost sm" id="ch-add" style="justify-self:start">${I('plus')}Ajouter un canal</button>` : ''}</div>
      <label class="field"><span>Formats (un par ligne)</span><textarea class="textarea" id="fmt-list" ${owner ? '' : 'disabled'}>${esc((w.settings.formats || []).join('\n'))}</textarea></label>
      ${owner ? '<button class="btn primary" id="ch-save" style="justify-self:start">Enregistrer les canaux et formats</button>' : ''}`,
    alternance:`<p class="muted" style="margin:0">Le calque colore chaque jour selon ton rythme : formation, entreprise, férié, examen ou vacances. Tu peux modifier un jour précis en touchant son numéro dans la vue Mois.</p>
      ${counts.length ? `<div class="legend" style="padding:0">${counts.map(t => `<span><i style="--c:var(--alt-${t.id})"></i>${t.name} : ${t.n} jour${t.n > 1 ? 's' : ''}</span>`).join('')}</div>` : '<p class="note">Aucun jour marqué pour l’instant.</p>'}
      ${canEdit() ? `<div class="note"><b style="color:var(--text)">Planning préchargé</b><br>${esc(PRESET_ALT.name)}.</div>
      <div class="row" style="flex-wrap:wrap"><button class="btn primary" id="alt-import">${S.marks.size ? 'Réappliquer le planning de la classe' : 'Importer le planning de la classe'}</button>${S.marks.size ? `<button class="btn danger" id="alt-clear">Effacer le calque</button>` : ''}</div>` : ''}`
  };
  if (!panes[tab]) tab = 'general';
  openModal({ title:'Réglages de l’espace', wide:true, body:`<div class="tabs" role="tablist">${tabs.map(([id, n]) => `<button role="tab" data-tab="${id}" aria-selected="${tab === id}">${n}</button>`).join('')}</div><div style="display:grid;gap:16px">${panes[tab]}</div>`,
  onMount(m){
    $$('[data-tab]', m).forEach(b => b.addEventListener('click', () => openWsSettings(b.dataset.tab)));
    $('#ws-rename', m)?.addEventListener('click', async () => {
      const name = $('#ws-name', m).value.trim(); if (!name) return;
      try { Object.assign(w, await S.be.updateWorkspace(w.id, { name })); const li = S.workspaces.find(x => x.id === w.id); if (li) li.name = name; renderAll(); toast('Espace renommé'); } catch (e) { toast(errMsg(e), 'err'); }
    });
    $('#ws-copy', m)?.addEventListener('click', () => { navigator.clipboard?.writeText(w.invite_code).then(() => toast('Code copié'), () => toast('Copie impossible : note le code à la main.', 'err')); });
    $('#ws-delete', m)?.addEventListener('click', async () => {
      if (prompt(`Pour confirmer, tape le nom de l’espace : ${w.name}`) !== w.name) return toast('Suppression annulée.');
      try { await S.be.deleteWorkspace(w.id); closeModal(); await loadWorkspaces(null); renderAll(); toast('Espace supprimé'); } catch (e) { toast(errMsg(e), 'err'); }
    });
    $('#ws-leave', m)?.addEventListener('click', async () => {
      if (!confirm(`Quitter « ${w.name} » ? Tu pourras revenir avec le code d’invitation.`)) return;
      try { await S.be.leaveWorkspace(w.id); closeModal(); await loadWorkspaces(null); renderAll(); toast('Tu as quitté l’espace'); } catch (e) { toast(errMsg(e), 'err'); }
    });
    if (tab === 'members') {
      S.be.listMembers(w.id).then(list => {
        S.members = list; const box = $('#members', m); if (!box) return;
        box.innerHTML = list.sort((a, b) => (a.role === 'owner' ? -1 : b.role === 'owner' ? 1 : 0)).map(x => `<div class="member"><span class="ava">${esc(initials(x.display_name))}</span><span class="who"><b>${esc(x.display_name)}${x.user_id === S.user.id ? ' (toi)' : ''}</b><small>${{ owner:'Propriétaire', editor:'Éditeur', viewer:'Lecteur' }[x.role]}${x.role === 'owner' || x.can_approve ? ', approbateur' : ''}</small></span>
          ${owner && x.user_id !== S.user.id ? `<label class="check" style="margin-right:6px"><input type="checkbox" data-appr="${x.user_id}" ${x.can_approve ? 'checked' : ''}><span>Approbateur</span></label><select class="select" data-role="${x.user_id}" style="width:auto;min-height:34px" aria-label="Rôle"><option value="editor" ${x.role === 'editor' ? 'selected' : ''}>Éditeur</option><option value="viewer" ${x.role === 'viewer' ? 'selected' : ''}>Lecteur</option></select><button class="icon-btn" data-kick="${x.user_id}" aria-label="Retirer ${esc(x.display_name)}">${I('x')}</button>` : ''}</div>`).join('');
        $$('[data-role]', box).forEach(s => s.addEventListener('change', async () => { try { await S.be.setRole(w.id, s.dataset.role, s.value); toast('Rôle mis à jour'); } catch (e) { toast(errMsg(e), 'err'); } }));
        $$('[data-appr]', box).forEach(c => c.addEventListener('change', async () => { try { await S.be.setApprover(w.id, c.dataset.appr, c.checked); const mm = S.members.find(x => x.user_id === c.dataset.appr); if (mm) mm.can_approve = c.checked; toast(c.checked ? 'Approbateur ajouté' : 'Approbateur retiré'); } catch (e) { c.checked = !c.checked; toast(errMsg(e), 'err'); } }));
        $$('[data-kick]', box).forEach(b => b.addEventListener('click', async () => { if (!confirm('Retirer ce membre de l’espace ?')) return; try { await S.be.removeMember(w.id, b.dataset.kick); openWsSettings('members'); toast('Membre retiré'); } catch (e) { toast(errMsg(e), 'err'); } }));
      }).catch(e => { const box = $('#members', m); if (box) box.innerHTML = `<p class="form-error">${esc(errMsg(e))}</p>`; });
    }
    if (tab === 'validation') {
      const steps = clone(vc.steps);
      const draw = () => {
        $('#val-steps', m).innerHTML = steps.map((s, i) => `<div class="erow"><span class="pill">${i + 1}</span><input class="input" value="${esc(s.name || '')}" data-sn="${i}" ${owner ? '' : 'disabled'} maxlength="40" aria-label="Nom de l’étape ${i + 1}">${owner && steps.length > 1 ? `<button class="icon-btn" data-sx="${i}" aria-label="Supprimer l’étape ${i + 1}">${I('trash')}</button>` : ''}</div>`).join('');
        $$('[data-sn]', m).forEach(x => x.addEventListener('input', () => steps[+x.dataset.sn].name = x.value));
        $$('[data-sx]', m).forEach(x => x.addEventListener('click', () => { steps.splice(+x.dataset.sx, 1); draw(); }));
      };
      draw();
      $('#val-add', m)?.addEventListener('click', () => { if (steps.length >= 4) return toast('Quatre étapes maximum.', 'err'); steps.push({ name:steps.length ? 'Validation finale' : 'Relecture' }); draw(); });
      $('#val-save', m)?.addEventListener('click', async () => {
        const clean = steps.map(s => ({ name:(s.name || '').trim() || 'Étape' }));
        const settings = { ...w.settings, validation:{ enabled:$('#val-on', m).checked, steps:clean } };
        try { const r = await S.be.updateWorkspace(w.id, { settings }); w.settings = { ...clone(DEFAULT_WS_SETTINGS), ...r.settings }; renderAll(); toast('Circuit de validation enregistré'); } catch (e) { toast(errMsg(e), 'err'); }
      });
    }
    if (tab === 'links') {
      $('#lk-new', m)?.addEventListener('click', () => openShare({}));
      $$('[data-lk-copy]', m).forEach(b => b.addEventListener('click', () => { const l = S.links.find(x => x.id === b.dataset.lkCopy); navigator.clipboard?.writeText(linkURL(l)).then(() => toast('Lien copié'), () => toast('Copie impossible.', 'err')); }));
      $$('[data-lk-off]', m).forEach(b => b.addEventListener('click', async () => {
        if (!confirm('Désactiver ce lien ? La personne ne pourra plus l’ouvrir.')) return;
        try { const l = S.links.find(x => x.id === b.dataset.lkOff); Object.assign(l, await S.be.update('share_links', l.id, { revoked:true })); openWsSettings('links'); toast('Lien désactivé'); } catch (e) { toast(errMsg(e), 'err'); }
      }));
    }
    if (tab === 'channels') {
      const chs = clone(w.settings.channels);
      const draw = () => {
        $('#ch-list', m).innerHTML = chs.map((c, i) => `<div class="erow"><input type="color" value="${esc(c.color)}" data-ci="${i}" ${owner ? '' : 'disabled'} aria-label="Couleur de ${esc(c.name)}"><input class="input" value="${esc(c.name)}" data-cn="${i}" ${owner ? '' : 'disabled'} aria-label="Nom du canal">${owner ? `<button class="icon-btn" data-cx="${i}" aria-label="Supprimer ${esc(c.name)}">${I('trash')}</button>` : ''}</div>`).join('');
        $$('[data-ci]', m).forEach(x => x.addEventListener('input', () => chs[+x.dataset.ci].color = x.value));
        $$('[data-cn]', m).forEach(x => x.addEventListener('input', () => chs[+x.dataset.cn].name = x.value));
        $$('[data-cx]', m).forEach(x => x.addEventListener('click', () => { chs.splice(+x.dataset.cx, 1); draw(); }));
      };
      draw();
      $('#ch-add', m)?.addEventListener('click', () => { chs.push({ id:'c-' + Math.random().toString(36).slice(2, 8), name:'Nouveau canal', color:CAMP_COLORS[chs.length % CAMP_COLORS.length] }); draw(); $$('[data-cn]', m).pop()?.select(); });
      $('#ch-save', m)?.addEventListener('click', async () => {
        const clean = chs.filter(c => c.name.trim()).map(c => ({ ...c, name:c.name.trim() }));
        if (!clean.length) return toast('Garde au moins un canal.', 'err');
        const formats = $('#fmt-list', m).value.split('\n').map(s => s.trim()).filter(Boolean);
        try { const r = await S.be.updateWorkspace(w.id, { settings:{ ...w.settings, channels:clean, formats } }); w.settings = { ...clone(DEFAULT_WS_SETTINGS), ...r.settings }; renderAll(); toast('Canaux et formats enregistrés'); } catch (e) { toast(errMsg(e), 'err'); }
      });
    }
    $('#alt-import', m)?.addEventListener('click', async () => {
      try { const rows = presetRows(w.id); await S.be.bulkDayMarks(w.id, rows); rows.forEach(r => S.marks.set(r.day, r.type)); if (!S.prefs.showAlt) setPref('showAlt', true); renderAll(); openWsSettings('alternance'); toast(`Planning importé : ${rows.length} jours`); }
      catch (e) { toast(errMsg(e), 'err'); }
    });
    $('#alt-clear', m)?.addEventListener('click', async () => {
      if (!confirm('Effacer tous les jours du calque alternance de cet espace ?')) return;
      try { await S.be.clearDayMarks(w.id); S.marks.clear(); renderAll(); openWsSettings('alternance'); toast('Calque effacé'); } catch (e) { toast(errMsg(e), 'err'); }
    });
  } });
}

/* ---------- Page de validation externe (sans compte) ---------- */
async function renderReview(token, keepScroll){
  S.prefs = loadLocalPrefs(); applyPrefs();
  const root = $('#root'), y = keepScroll ? window.scrollY : 0;
  if (!keepScroll) root.innerHTML = `<div class="rvpage"><p class="muted">Chargement des contenus…</p></div>`;
  let data;
  try { data = await S.be.reviewGet(token); }
  catch (e) { root.innerHTML = `<div class="gate"><div class="gate-form" style="grid-column:1/-1"><div class="gate-card"><h2>Lien indisponible</h2><p class="sub">${esc(errMsg(e))}</p><p class="meta-line">Demande un nouveau lien à la personne qui te l’a envoyé.</p></div></div></div>`; return; }
  S.ws = { name:data.workspace.name, settings:{ channels:data.workspace.channels || DEFAULT_WS_SETTINGS.channels, validation:{ enabled:true, steps:data.workspace.steps } } };
  const steps = valCfg().steps, name = localStorage.getItem('cadence_reviewer') || '';
  const postHTML = p => {
    const c = chan(p.channel), okN = p.reviews.filter(r => r.decision === 'approved').length;
    const state = p.locked || ['programme','publie'].includes(p.status) ? 'Validé' : p.status === 'a_valider' ? `En attente de validation, étape ${Math.min(okN + 1, steps.length)} sur ${steps.length}` : 'En préparation, pas encore soumis';
    const decide = data.link.allow_decision && p.status === 'a_valider';
    const th = { comments:p.comments.map(x => ({ ...x, author_name:x.author, user_id:null })), reviews:p.reviews.map(r => ({ ...r, actor_name:r.author })), events:[] };
    return `<article class="rv-post" id="rv-${p.id}">
      <div class="rv-meta"><span class="pill"><span class="dot" style="--c:${esc(c.color)}"></span>${esc(c.name)}</span>${p.format ? `<span class="pill">${esc(p.format)}</span>` : ''}<span class="pill">${p.pub_date ? fmtDay(p.pub_date) + (p.pub_time ? ' à ' + fmtTime(p.pub_time) : '') : 'Date à définir'}</span><span class="pill rv-state">${state}</span></div>
      <h2>${esc(p.title || 'Sans titre')}</h2>
      <div class="rv-body"><div>${previewHTML(p, { account:data.workspace.name })}</div>
        <div class="rv-side">
          ${th.comments.length || th.reviews.length ? timelineHTML(th) : '<p class="muted" style="margin:0">Aucun retour pour l’instant.</p>'}
          <textarea class="textarea" id="rv-c-${p.id}" placeholder="${decide ? 'Ton commentaire (obligatoire pour demander des modifications)' : 'Ton commentaire'}" style="min-height:84px" maxlength="2000"></textarea>
          <div class="row wrap">${decide ? `<button class="btn primary" data-rv="approved" data-id="${p.id}">${I('check')}Valider</button><button class="btn" data-rv="changes" data-id="${p.id}">Demander des modifications</button>` : ''}<button class="btn ghost" data-rv="comment" data-id="${p.id}">${I('chat')}Commenter</button></div>
        </div></div></article>`;
  };
  root.innerHTML = `<div class="rvpage">
    <header class="rv-head">${brandMark()}<div><h1>${esc(data.link.label || 'Validation de contenus')}</h1><p class="muted">${esc(data.workspace.name)}, ${data.posts.length} contenu${data.posts.length > 1 ? 's' : ''}${data.link.expires_at ? `, lien valable jusqu’au ${new Date(data.link.expires_at).toLocaleDateString('fr-FR')}` : ''}</p></div></header>
    <label class="field rv-name"><span>Ton nom, affiché avec tes réponses</span><input class="input" id="rv-name" value="${esc(name)}" maxlength="60" autocomplete="name" placeholder="Prénom Nom"></label>
    ${data.posts.map(postHTML).join('') || '<p class="note">Aucun contenu dans ce lien pour le moment.</p>'}
    <p class="meta-line">Page de validation Cadence : aucun compte nécessaire. Tes réponses sont transmises à l’équipe qui t’a envoyé ce lien.</p>
  </div>`;
  hydrateMedia(root);
  if (keepScroll) window.scrollTo(0, y);
  $('#rv-name').addEventListener('input', e => localStorage.setItem('cadence_reviewer', e.target.value.trim()));
  root.onclick = async e => {
    const more = e.target.closest('.pv-more'); if (more) { more.previousElementSibling.hidden = false; more.remove(); return; }
    const b = e.target.closest('[data-rv]'); if (!b) return;
    const who = $('#rv-name').value.trim(), txt = $(`#rv-c-${b.dataset.id}`).value.trim(), act = b.dataset.rv;
    if (!who) { $('#rv-name').focus(); return toast('Indique ton nom avant de répondre.', 'err'); }
    if (act !== 'approved' && !txt) return toast('Écris un commentaire.', 'err');
    b.disabled = true;
    try {
      await S.be.reviewAct(token, b.dataset.id, who, act === 'comment' ? null : act, txt);
      toast(act === 'approved' ? 'Merci, validation enregistrée' : act === 'changes' ? 'Demande de modifications envoyée' : 'Commentaire envoyé');
      renderReview(token, true);
    } catch (err) { b.disabled = false; toast(errMsg(err), 'err'); }
  };
}

/* ---------- Écouteurs V2 ---------- */
document.addEventListener('click', e => {
  if (DnD.suppress) return;
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action;
  if (a === 'pv-more') { el.previousElementSibling && (el.previousElementSibling.hidden = false); el.remove(); }
  if (a === 'media-tag') { S.mediaTag = S.mediaTag === el.dataset.tag ? '' : el.dataset.tag; renderView(); }
  if (a === 'open-asset') openAsset(el.dataset.id);
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset?.filter === 'grid-ch') { S.gridChannel = t.value; renderView(); }
  if (t.dataset?.upload === 'library' && t.files?.length) { const got = await uploadMany([...t.files]); t.value = ''; if (got.length) toast(`${got.length} visuel${got.length > 1 ? 's' : ''} importé${got.length > 1 ? 's' : ''}`); renderView(); }
});
document.addEventListener('input', debounce(e => { if (e.target.dataset?.filter === 'media-q') { S.mediaQ = e.target.value.trim(); const pos = e.target.selectionStart; renderView(); const inp = $('[data-filter="media-q"]'); if (inp) { inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (x) {} } } }, 250));

DnD.init();
boot();
</script>
</body>
</html>
