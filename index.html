<!DOCTYPE html>
<html lang="fr" data-theme="dark" data-density="confort">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence : calendrier éditorial</title>
<meta name="description" content="Calendrier éditorial partagé pour la classe de Bachelor Communication, Marketing et Événementiel.">
<meta name="theme-color" content="#17181B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadence">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* ---------- Jetons ---------- */
:root{
  --font:"Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --accent:#F5D547; --accent-ink:#17181B;
  --r-xs:4px; --r-sm:7px; --r-md:11px; --r-lg:18px;
  --alt-formation:#3FB6A8; --alt-entreprise:#8C95A3; --alt-ferie:#E8A33D; --alt-examen:#E0607E; --alt-vacances:#6F7F95;
  --st-idee:#8A8F98; --st-redaction:#6FA8FF; --st-a_valider:#E8A33D; --st-programme:#A58BFF; --st-publie:#4CC38A;
  --side-w:252px; --ideas-w:300px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
html[data-theme="dark"]{
  --bg:#17181B; --surface:#1F2125; --surface-2:#26282D; --surface-3:#30333A;
  --line:#34373E; --line-soft:#2A2D33; --text:#ECEDEF; --muted:#A0A5AD; --faint:#6E737B;
  --shadow:0 18px 40px rgba(0,0,0,.5); --accent-text:var(--accent); --tint:.16;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface-2:#F4F5F7; --surface-3:#E6E8EC;
  --line:#D6D9DF; --line-soft:#E4E6EA; --text:#16171A; --muted:#585D66; --faint:#8A8F97;
  --shadow:0 18px 40px rgba(22,26,34,.16); --accent-text:color-mix(in srgb, var(--accent) 42%, #000); --tint:.13;
  color-scheme:light;
}
html[data-density="compact"]{ --cell-min:92px; --chip-h:20px; --gap:6px; }
html[data-density="confort"]{ --cell-min:124px; --chip-h:24px; --gap:10px; }

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{
  font-family:var(--font); font-size:15px; line-height:1.45; color:var(--text); background:var(--bg);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; background:none; border:0; padding:0; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-xs); }
svg.i{ width:18px; height:18px; flex:none; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.muted{ color:var(--muted); } .faint{ color:var(--faint); }
[hidden]{ display:none !important; }

/* ---------- Contrôles ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; height:38px; padding:0 14px;
  border-radius:var(--r-sm); border:1px solid var(--line); background:var(--surface-2); color:var(--text);
  font-weight:550; white-space:nowrap; transition:background .15s, border-color .15s;
}
.btn:hover{ background:var(--surface-3); }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.btn.primary:hover{ filter:brightness(1.06); }
.btn.ghost{ background:transparent; border-color:transparent; }
.btn.ghost:hover{ background:var(--surface-2); }
.btn.danger{ color:#F0707F; }
.btn.sm{ height:32px; padding:0 10px; font-size:14px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.icon-btn{ width:36px; height:36px; display:inline-grid; place-items:center; border-radius:var(--r-sm); color:var(--muted); }
.icon-btn:hover{ background:var(--surface-2); color:var(--text); }
.icon-btn.on{ color:var(--accent-text); background:color-mix(in srgb, var(--accent) 14%, transparent); }

.field{ display:grid; gap:6px; }
.field > span{ font-size:13px; color:var(--muted); font-weight:500; }
.input, .select, .textarea{
  width:100%; min-height:40px; padding:9px 12px; border-radius:var(--r-sm); border:1px solid var(--line);
  background:var(--surface-2); outline:none; transition:border-color .15s;
}
.textarea{ min-height:120px; resize:vertical; line-height:1.5; }
.input:focus, .select:focus, .textarea:focus{ border-color:var(--accent); }
.select{ appearance:none; background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position:calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size:5px 5px; background-repeat:no-repeat; padding-right:30px; }
.row{ display:flex; gap:10px; align-items:center; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.check{ display:flex; gap:10px; align-items:flex-start; font-size:13.5px; color:var(--muted); }
.check input{ margin-top:3px; accent-color:var(--accent); }

.seg{ display:inline-flex; padding:3px; border-radius:var(--r-sm); background:var(--surface-2); border:1px solid var(--line-soft); gap:2px; }
.seg button{ height:30px; padding:0 11px; border-radius:5px; color:var(--muted); font-weight:550; font-size:14px; }
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--text); box-shadow:0 1px 0 var(--line); }
html[data-theme="dark"] .seg button[aria-pressed="true"]{ background:var(--surface-3); }

.pill{ display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px; border-radius:99px; font-size:12.5px; font-weight:600; background:var(--surface-3); color:var(--muted); white-space:nowrap; }
.pill .dot, .dot{ width:8px; height:8px; border-radius:50%; background:var(--c, var(--faint)); flex:none; }
.toggle-chip{ display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 11px; border-radius:99px; border:1px solid var(--line); color:var(--muted); font-size:13.5px; font-weight:550; }
.toggle-chip[aria-pressed="true"]{ border-color:transparent; background:color-mix(in srgb, var(--c, var(--accent)) 22%, transparent); color:var(--text); }

.st-idee{ --st:var(--st-idee); } .st-redaction{ --st:var(--st-redaction); } .st-a_valider{ --st:var(--st-a_valider); } .st-programme{ --st:var(--st-programme); } .st-publie{ --st:var(--st-publie); }
.status-pill{ background:color-mix(in srgb, var(--st) 20%, transparent); color:var(--text); }
.status-pill .dot{ background:var(--st); }

/* ---------- Écrans d'accès ---------- */
.daynum, .yd, .whead .d b, .chip .tm, .lrow .dt, .lrow .tm, .counter, .code-box b, .ym-foot, .nav .count, .card .top{ font-variant-numeric:tabular-nums; }
#root{ min-height:100%; }
.gate{ min-height:100vh; min-height:100dvh; display:grid; grid-template-columns:1.1fr 1fr; }
.gate-art{ position:relative; padding:calc(48px + var(--safe-t)) 56px 48px; display:flex; flex-direction:column; justify-content:space-between; background:var(--surface); border-right:1px solid var(--line-soft); overflow:hidden; }
.wordmark{ font-size:clamp(64px, 9vw, 128px); line-height:.88; font-weight:850; letter-spacing:-.045em; margin:0; }
.gate-art p{ max-width:34ch; color:var(--muted); font-size:17px; margin:18px 0 0; }
.gate-strip{ display:grid; grid-template-columns:repeat(var(--n), 1fr); gap:3px; height:74px; align-items:end; }
.gate-strip i{ display:block; border-radius:2px; background:var(--c); height:var(--h); transform-origin:bottom; animation:rise .9s var(--ease) both; animation-delay:calc(var(--k) * 14ms); }
@keyframes rise{ from{ transform:scaleY(0); } to{ transform:scaleY(1); } }
.gate-legend{ display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; font-size:13px; color:var(--muted); }
.gate-legend span{ display:inline-flex; align-items:center; gap:7px; }
.gate-form{ display:grid; place-items:center; padding:calc(40px + var(--safe-t)) 24px calc(40px + var(--safe-b)); }
.gate-form{ position:relative; }
.gate-version{ position:absolute; left:24px; right:24px; bottom:calc(16px + var(--safe-b)); margin:0; text-align:center; font-size:12.5px; color:var(--faint); }
.changelog{ display:grid; gap:14px; }
.cl-row{ display:grid; grid-template-columns:118px 1fr; gap:12px; align-items:baseline; padding-bottom:12px; border-bottom:1px solid var(--line-soft); }
.cl-row:last-child{ border-bottom:0; }
.cl-row b{ font-size:15px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; } .cl-row p{ margin:0; color:var(--muted); font-size:14px; }
@media (max-width:700px){ .gate-form{ padding-bottom:calc(64px + var(--safe-b)); } .cl-row{ grid-template-columns:1fr; gap:4px; } }
.gate-card{ width:min(400px, 100%); display:grid; gap:16px; }
.gate-card h2{ font-size:28px; letter-spacing:-.02em; margin:0; line-height:1.1; }
.gate-card .sub{ color:var(--muted); margin:-6px 0 4px; }
.gate-card .links{ display:flex; justify-content:space-between; gap:12px; font-size:14px; }
.link{ color:var(--accent-text); font-weight:600; text-decoration:none; }
.link:hover{ text-decoration:underline; }
.pw-wrap{ position:relative; }
.pw-wrap .input{ padding-right:88px; }
.pw-eye{ position:absolute; right:6px; top:50%; transform:translateY(-50%); height:30px; padding:0 10px; border-radius:5px; font-size:13px; font-weight:600; color:var(--muted); }
.pw-eye:hover{ background:var(--surface-3); color:var(--text); }
.form-error{ color:#F0707F; font-size:14px; min-height:0; }
.form-ok{ color:var(--st-publie); font-size:14px; }

/* ---------- Coquille de l'app ---------- */
.app{ height:100%; display:grid; grid-template-columns:var(--side-w) minmax(0,1fr) auto; }
.side{ display:flex; flex-direction:column; gap:18px; padding:calc(18px + var(--safe-t)) 14px calc(14px + var(--safe-b)); border-right:1px solid var(--line-soft); background:var(--surface); overflow-y:auto; }
.brand{ display:flex; align-items:center; gap:10px; padding:0 6px; font-weight:800; font-size:19px; letter-spacing:-.02em; }
.brand-mark{ width:26px; height:26px; display:grid; grid-template-columns:repeat(4,1fr); gap:2px; align-items:end; }
.brand-mark i{ display:block; border-radius:1.5px; background:var(--c); height:var(--h); }
.ws-switch{ display:flex; align-items:center; gap:10px; width:100%; padding:10px; border-radius:var(--r-md); border:1px solid var(--line); background:var(--surface-2); text-align:left; }
.ws-switch:hover{ border-color:var(--faint); }
.ws-avatar{ width:30px; height:30px; border-radius:8px; display:grid; place-items:center; font-weight:750; font-size:13px; background:var(--accent); color:var(--accent-ink); flex:none; }
.ws-avatar.team{ background:var(--surface-3); color:var(--text); }
.ws-meta{ min-width:0; flex:1; }
.ws-meta b{ display:block; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ws-meta small{ color:var(--muted); font-size:12.5px; }
.nav{ display:grid; gap:2px; }
.nav button{ display:flex; align-items:center; gap:11px; height:38px; padding:0 10px; border-radius:var(--r-sm); color:var(--muted); font-weight:550; text-align:left; }
.nav button:hover{ background:var(--surface-2); color:var(--text); }
.nav button[aria-current="true"]{ background:var(--surface-2); color:var(--text); }
.nav button[aria-current="true"] svg{ color:var(--accent-text); }
.nav .count{ margin-left:auto; font-size:12.5px; color:var(--faint); }
.side-sec{ display:grid; gap:6px; }
.side-sec > header{ display:flex; align-items:center; justify-content:space-between; padding:0 6px 0 10px; font-size:13px; font-weight:650; color:var(--muted); }
.camp-item{ display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:var(--r-sm); text-align:left; width:100%; }
.camp-item:hover{ background:var(--surface-2); }
.camp-item .bar-swatch{ width:4px; align-self:stretch; border-radius:2px; background:var(--c); flex:none; }
.camp-item b{ display:block; font-size:14px; font-weight:600; line-height:1.25; }
.camp-item small{ color:var(--faint); font-size:12.5px; }
.legend{ display:grid; gap:4px; padding:0 10px; }
.legend span{ display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--muted); }
.legend i{ width:14px; height:10px; border-radius:2px; background:var(--c); }
.side-empty{ padding:4px 10px; font-size:13.5px; color:var(--faint); }
.side-foot{ margin-top:auto; }
.me{ display:flex; align-items:center; gap:10px; width:100%; padding:8px; border-radius:var(--r-md); text-align:left; }
.me:hover{ background:var(--surface-2); }
.me .ava{ width:32px; height:32px; border-radius:50%; background:var(--surface-3); display:grid; place-items:center; font-weight:700; font-size:13px; }
.me b{ display:block; font-size:14px; } .me small{ color:var(--muted); font-size:12.5px; }

.main{ min-width:0; display:flex; flex-direction:column; height:100%; overflow:hidden; }
.toolbar{ display:flex; align-items:flex-end; gap:16px; padding:calc(18px + var(--safe-t)) 24px 14px; border-bottom:1px solid var(--line-soft); }
.period{ min-width:220px; flex:1 1 260px; }
.period h1{ margin:0; font-size:clamp(26px, 3vw, 38px); line-height:1; letter-spacing:-.035em; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.period h1 span{ color:var(--faint); font-weight:500; }
.rhythm{ display:grid; grid-template-columns:repeat(var(--n), 1fr); gap:2px; height:6px; margin-top:12px; max-width:420px; }
.rhythm i{ border-radius:1px; background:var(--c, var(--line)); }
.rhythm i.none{ background:var(--line-soft); }
.tools{ display:flex; align-items:center; gap:8px; flex:0 1 auto; justify-content:flex-end; }
.main{ container-type:inline-size; }
@container (max-width:1020px){ .toolbar .seg.views{ display:none; } }
@container (max-width:900px){ .toolbar .new-desktop .label{ display:none; } .toolbar .new-desktop{ width:38px; padding:0; } }
.navarrows{ display:flex; align-items:center; gap:2px; }
.menu-btn{ display:none; }

.filters{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 24px; border-bottom:1px solid var(--line-soft); background:var(--surface); }
.filters .input{ width:220px; min-height:32px; padding:5px 10px; }
.filters .select{ width:auto; min-height:32px; padding:4px 30px 4px 10px; font-size:14px; }
.filters .sep{ width:1px; height:22px; background:var(--line); margin:0 4px; }
.view{ flex:1; overflow:auto; position:relative; -webkit-overflow-scrolling:touch; }

/* ---------- Vue mois ---------- */
.month{ display:flex; flex-direction:column; min-height:100%; padding:0 24px 24px; }
.dow{ position:sticky; top:0; z-index:3; display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); background:var(--bg); border-bottom:1px solid var(--line-soft); }
.dow span{ padding:10px 10px 8px; font-size:12.5px; font-weight:600; color:var(--faint); }
.weeks{ flex:1; display:grid; grid-auto-rows:minmax(var(--cell-min), 1fr); }
.week{ position:relative; display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); border-bottom:1px solid var(--line-soft); --lanes:0; }
.cell{ position:relative; min-width:0; padding:calc(34px + var(--lanes) * 21px) 6px 8px; border-right:1px solid var(--line-soft); cursor:default; }
.cell:first-child{ border-left:1px solid var(--line-soft); }
.cell::before{ content:""; position:absolute; inset:0; background:var(--altc, transparent); opacity:var(--tint); pointer-events:none; }
.cell::after{ content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--altc, transparent); pointer-events:none; }
.cell.out{ opacity:.45; }
.cell.sel{ box-shadow:inset 0 0 0 1.5px var(--accent); }
.cell-head{ position:absolute; top:6px; left:6px; right:6px; display:flex; align-items:center; gap:6px; }
.daynum{ min-width:26px; height:26px; padding:0 6px; border-radius:7px; font-weight:650; font-size:14px; }
.daynum:hover{ background:var(--surface-3); }
.cell.today .daynum{ background:var(--accent); color:var(--accent-ink); }
.alt-tag{ font-size:11.5px; font-weight:600; color:var(--altc); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
html[data-theme="light"] .alt-tag{ color:color-mix(in srgb, var(--altc) 70%, #000); }
.alt-formation{ --altc:var(--alt-formation); } .alt-entreprise{ --altc:var(--alt-entreprise); } .alt-ferie{ --altc:var(--alt-ferie); } .alt-examen{ --altc:var(--alt-examen); } .alt-vacances{ --altc:var(--alt-vacances); }
.no-alt .cell::before, .no-alt .cell::after, .no-alt .alt-tag, .no-alt .yd::after, .no-alt .wcol::before{ display:none; }
.chips{ position:relative; display:grid; grid-template-columns:minmax(0,1fr); gap:3px; }
.chip{
  position:relative; display:flex; align-items:center; gap:6px; width:100%; min-height:var(--chip-h); padding:2px 7px 2px 6px;
  border-radius:5px; background:var(--surface-2); border:1px solid var(--line-soft); font-size:12.5px; font-weight:550; text-align:left;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation;
}
.chip:hover{ border-color:var(--faint); }
.chip .dot{ background:var(--ch); }
.chip .t{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chip .tm{ color:var(--faint); font-weight:500; }
.chip::after{ content:""; position:absolute; right:4px; top:50%; width:6px; height:6px; margin-top:-3px; border-radius:2px; background:var(--st); opacity:.9; }
.chip{ padding-right:16px; }
.more{ font-size:12px; color:var(--muted); font-weight:600; text-align:left; padding:1px 4px; border-radius:4px; }
.more:hover{ background:var(--surface-3); color:var(--text); }
.bars{ position:absolute; left:0; right:0; top:34px; display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); grid-auto-rows:18px; row-gap:3px; pointer-events:none; z-index:2; }
.bar{ pointer-events:auto; margin:0 3px; height:18px; padding:0 8px; border-radius:4px; background:color-mix(in srgb, var(--c) 30%, var(--surface)); color:var(--text); font-size:11.5px; font-weight:650; text-align:left; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; border-left:3px solid var(--c); }
.bar.cont-l{ border-top-left-radius:0; border-bottom-left-radius:0; border-left-width:0; margin-left:0; }
.bar.cont-r{ border-top-right-radius:0; border-bottom-right-radius:0; margin-right:0; }
.bar.temps_fort{ background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 34%, var(--surface)) 0 6px, color-mix(in srgb, var(--c) 22%, var(--surface)) 6px 12px); }
.agenda{ display:none; }

/* ---------- Vue semaine ---------- */
.weekview{ display:grid; grid-template-columns:repeat(7, minmax(128px, 1fr)); min-height:100%; padding:0 24px 24px; min-width:940px; }
.wcol{ position:relative; display:flex; flex-direction:column; border-right:1px solid var(--line-soft); min-height:100%; }
.wcol:first-child{ border-left:1px solid var(--line-soft); }
.wcol::before{ content:""; position:absolute; inset:0; background:var(--altc, transparent); opacity:calc(var(--tint) * .6); pointer-events:none; }
.whead{ position:sticky; top:0; z-index:2; padding:12px 10px 10px; background:var(--bg); border-bottom:1px solid var(--line-soft); border-top:3px solid var(--altc, transparent); }
.whead .d{ display:flex; align-items:baseline; gap:8px; }
.whead .d b{ font-size:24px; font-weight:800; letter-spacing:-.03em; }
.wcol.today .whead .d b{ color:var(--accent-text); }
.whead .d span{ color:var(--muted); font-size:13.5px; }
.wbars{ display:grid; gap:3px; padding:6px 0 0; }
.wbars .bar{ margin:0 6px; }
.wlist{ position:relative; flex:1; display:grid; align-content:start; gap:6px; padding:8px 6px 16px; }
.card{
  position:relative; display:grid; gap:4px; width:100%; padding:9px 10px 10px 12px; border-radius:var(--r-sm); background:var(--surface);
  border:1px solid var(--line-soft); text-align:left; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation;
}
.card::before{ content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:0 2px 2px 0; background:var(--ch); }
.card:hover{ border-color:var(--faint); }
.card .top{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); font-weight:550; }
.card .top .fmt{ margin-left:auto; }
.card .ttl{ font-weight:650; font-size:14px; line-height:1.3; overflow-wrap:anywhere; }
.card .meta{ display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
.card .thumb{ width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:5px; background:var(--surface-3); }
.addslot{ height:34px; border-radius:var(--r-sm); border:1px dashed var(--line); color:var(--faint); font-size:13px; font-weight:550; opacity:0; transition:opacity .15s; }
.wcol:hover .addslot, .addslot:focus-visible{ opacity:1; }

/* ---------- Vue année ---------- */
.year{ display:grid; grid-template-columns:repeat(auto-fill, minmax(228px, 1fr)); gap:16px; padding:20px 24px 32px; }
.ym{ display:grid; gap:10px; align-content:start; padding:16px; border-radius:var(--r-lg); background:var(--surface); border:1px solid var(--line-soft); }
.ym.current{ border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); }
.ym-title{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; text-align:left; }
.ym-title b{ font-size:20px; font-weight:800; letter-spacing:-.03em; }
.ym-title span{ color:var(--faint); font-size:13px; font-weight:550; }
.ym-title:hover b{ color:var(--accent-text); }
.ym .rhythm{ margin:0; max-width:none; height:5px; }
.ym-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; }
.ym-grid .h{ font-size:11px; color:var(--faint); text-align:center; font-weight:600; padding-bottom:2px; }
.yd{ position:relative; aspect-ratio:1; border-radius:6px; font-size:12.5px; font-weight:550; color:var(--muted); display:grid; place-items:center; }
.yd::after{ content:""; position:absolute; inset:0; border-radius:6px; background:var(--altc, transparent); opacity:calc(var(--tint) * 1.3); pointer-events:none; }
.yd:hover{ background:var(--surface-3); color:var(--text); }
.yd.has{ color:var(--text); font-weight:750; }
.yd .n{ position:absolute; bottom:3px; left:50%; transform:translateX(-50%); display:flex; gap:2px; }
.yd .n i{ width:3px; height:3px; border-radius:50%; background:var(--accent-text); }
.yd.today{ background:var(--accent); color:var(--accent-ink); }
.yd.today .n i{ background:var(--accent-ink); }
.ym-camps{ display:flex; flex-wrap:wrap; gap:5px; min-height:0; }
.ym-camps button{ max-width:100%; }
.ym-foot{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:2px 10px; font-size:12.5px; color:var(--faint); }

/* ---------- Vue liste ---------- */
.list{ padding:8px 24px 32px; max-width:1100px; }
.list h3{ margin:22px 0 8px; font-size:13.5px; color:var(--muted); font-weight:650; }
.lrow{ display:grid; grid-template-columns:92px 58px minmax(0,1fr) auto; gap:14px; align-items:center; width:100%; padding:10px 12px; border-radius:var(--r-sm); text-align:left; border-bottom:1px solid var(--line-soft); }
.lrow:hover{ background:var(--surface); }
.lrow .dt{ font-weight:650; font-size:14px; } .lrow .dt small{ display:block; color:var(--faint); font-weight:500; font-size:12px; }
.lrow .tm{ color:var(--muted); font-size:13.5px; }
.lrow .main-t{ min-width:0; display:grid; gap:3px; }
.lrow .main-t b{ font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lrow .main-t small{ color:var(--muted); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.lrow .right{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }

/* ---------- Kanban ---------- */
.kanban{ display:grid; grid-template-columns:repeat(5, minmax(240px, 1fr)); gap:14px; padding:18px 24px 28px; min-height:100%; align-items:start; }
.kcol{ display:flex; flex-direction:column; gap:8px; padding:10px; border-radius:var(--r-lg); background:var(--surface-2); min-height:240px; border:1px solid transparent; }
.kcol header{ display:flex; align-items:center; gap:8px; padding:4px 4px 6px; font-weight:700; font-size:14.5px; }
.kcol header .dot{ background:var(--st); }
.kcol header small{ margin-left:auto; color:var(--faint); font-weight:600; }
.kcol .card{ background:var(--surface); }

/* ---------- Boîte à idées ---------- */
.ideas{ width:var(--ideas-w); display:flex; flex-direction:column; border-left:1px solid var(--line-soft); background:var(--surface); min-height:0; }
.ideas[data-open="false"]{ display:none; }
.ideas > header{ display:flex; align-items:center; gap:8px; padding:calc(20px + var(--safe-t)) 16px 10px; }
.ideas > header h2{ margin:0; font-size:17px; font-weight:750; letter-spacing:-.01em; flex:1; }
.ideas form{ padding:0 16px 12px; }
.ideas-list{ flex:1; overflow-y:auto; display:grid; align-content:start; gap:8px; padding:4px 16px calc(20px + var(--safe-b)); }
.ideas-empty{ padding:18px; border:1px dashed var(--line); border-radius:var(--r-md); color:var(--muted); font-size:14px; }
.ideas .card{ background:var(--surface-2); }

/* ---------- Glisser-déposer ---------- */
.drag-ghost{ position:fixed; left:0; top:0; z-index:1000; pointer-events:none; opacity:.95; box-shadow:var(--shadow); transform-origin:0 0; }
.dragging{ opacity:.35; }
body.is-dragging{ cursor:grabbing; user-select:none; -webkit-user-select:none; }
.drop-over{ box-shadow:inset 0 0 0 2px var(--accent) !important; }
.kcol.drop-over, .ideas.drop-over{ border-color:var(--accent); }

/* ---------- Modales, popovers, toasts ---------- */
.scrim{ position:fixed; inset:0; background:rgba(8,9,11,.55); z-index:200; animation:fade .18s ease both; }
.modal{
  position:fixed; z-index:201; top:50%; left:50%; transform:translate(-50%,-50%); width:min(560px, calc(100vw - 24px)); max-height:calc(100dvh - 40px);
  display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow);
  animation:pop .2s var(--ease) both;
}
.modal.wide{ width:min(760px, calc(100vw - 24px)); }
.modal > header{ display:flex; align-items:center; gap:10px; padding:18px 18px 12px 22px; }
.modal > header h2{ margin:0; font-size:20px; letter-spacing:-.02em; flex:1; }
.modal-body{ padding:6px 22px 20px; overflow-y:auto; display:grid; gap:16px; align-content:start; grid-auto-rows:max-content; min-height:0; flex:1 1 auto; }
.modal > header, .modal > footer{ flex:none; }
.modal > footer{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:14px 18px; border-top:1px solid var(--line-soft); }
.modal > footer .spacer{ flex:1; }
@keyframes fade{ from{ opacity:0; } }
@keyframes pop{ from{ opacity:0; transform:translate(-50%,-48%) scale(.98); } }
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line-soft); margin:0 -22px; padding:0 22px; overflow-x:auto; }
.tabs button{ height:38px; padding:0 10px; color:var(--muted); font-weight:600; border-bottom:2px solid transparent; white-space:nowrap; }
.tabs button[aria-selected="true"]{ color:var(--text); border-bottom-color:var(--accent); }
.popover{ position:fixed; z-index:150; min-width:230px; max-width:min(320px, calc(100vw - 16px)); padding:6px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--shadow); animation:fade .12s ease both; }
.popover .pitem{ display:flex; align-items:center; gap:10px; width:100%; padding:9px 10px; border-radius:var(--r-sm); text-align:left; font-weight:550; }
.popover .pitem:hover{ background:var(--surface-2); }
.popover .pitem[aria-checked="true"]{ color:var(--accent-text); }
.popover .phead{ padding:8px 10px 4px; font-size:12.5px; font-weight:650; color:var(--faint); }
.popover hr{ border:0; border-top:1px solid var(--line-soft); margin:6px 0; }
.toasts{ position:fixed; left:50%; bottom:calc(20px + var(--safe-b)); transform:translateX(-50%); z-index:400; display:grid; gap:8px; justify-items:center; pointer-events:none; }
.toast{ padding:10px 16px; border-radius:var(--r-md); background:var(--text); color:var(--bg); font-weight:600; font-size:14px; box-shadow:var(--shadow); animation:pop2 .2s var(--ease) both; }
.toast.err{ background:#E0607E; color:#fff; }
@keyframes pop2{ from{ opacity:0; transform:translateY(8px); } }

/* Fiche contenu */
.chan-pick{ display:flex; flex-wrap:wrap; gap:6px; }
.status-pick{ display:flex; flex-wrap:wrap; gap:6px; }
.status-pick .toggle-chip{ --c:var(--st); }
.status-pick .toggle-chip .dot{ background:var(--st); }
.tags{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; min-height:40px; padding:5px 8px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--surface-2); }
.tags:focus-within{ border-color:var(--accent); }
.tags input{ flex:1; min-width:120px; border:0; background:none; outline:none; padding:4px; }
.tag{ display:inline-flex; align-items:center; gap:4px; height:26px; padding:0 4px 0 9px; border-radius:99px; background:var(--surface-3); font-size:13px; font-weight:600; }
.tag button{ width:20px; height:20px; display:grid; place-items:center; border-radius:50%; color:var(--muted); }
.tag button:hover{ background:var(--line); color:var(--text); }
.counter{ font-size:12.5px; color:var(--faint); text-align:right; margin-top:-2px; }
.counter.over{ color:#F0707F; font-weight:650; }
.media-drop{ position:relative; display:grid; place-items:center; gap:6px; min-height:120px; border:1px dashed var(--line); border-radius:var(--r-md); color:var(--muted); font-size:14px; text-align:center; padding:14px; cursor:pointer; }
.media-drop:hover{ border-color:var(--faint); }
.media-drop img{ max-width:100%; max-height:260px; border-radius:var(--r-sm); display:block; }
.media-drop input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
.meta-line{ font-size:12.5px; color:var(--faint); }

/* Réglages */
.swatches{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.swatch{ width:32px; height:32px; border-radius:50%; background:var(--c); border:2px solid transparent; box-shadow:inset 0 0 0 1px rgba(0,0,0,.15); }
.swatch[aria-pressed="true"]{ border-color:var(--text); }
.swatch-custom{ position:relative; width:32px; height:32px; border-radius:50%; border:1px dashed var(--faint); display:grid; place-items:center; color:var(--muted); overflow:hidden; }
.swatch-custom input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
.editable-list{ display:grid; gap:6px; }
.editable-list .erow{ display:flex; gap:8px; align-items:center; }
.editable-list input[type="color"]{ width:40px; height:40px; padding:3px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--surface-2); flex:none; }
.member{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line-soft); }
.member .ava{ width:32px; height:32px; border-radius:50%; background:var(--surface-3); display:grid; place-items:center; font-weight:700; font-size:13px; flex:none; }
.member .who{ flex:1; min-width:0; } .member .who b{ display:block; font-size:14.5px; } .member .who small{ color:var(--muted); }
.code-box{ display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:var(--r-md); background:var(--surface-2); border:1px solid var(--line-soft); }
.code-box b{ font-size:24px; letter-spacing:.14em; font-weight:800; flex:1; }
.note{ padding:12px 14px; border-radius:var(--r-md); background:var(--surface-2); color:var(--muted); font-size:14px; }
.day-list{ display:grid; gap:8px; }

/* ---------- Barre d'onglets mobile ---------- */
.tabbar{ display:none; }
.fab{ display:none; }

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  :root{ --ideas-w:270px; }
  .toolbar .seg.views{ display:none; }
}
@media (max-width:980px){
  .app{ grid-template-columns:minmax(0,1fr); }
  .side{ position:fixed; z-index:120; left:0; top:0; bottom:0; width:min(300px, 86vw); transform:translateX(-102%); transition:transform .25s var(--ease); box-shadow:var(--shadow); }
  .app.side-open .side{ transform:none; }
  .side-scrim{ position:fixed; inset:0; z-index:110; background:rgba(8,9,11,.5); }
  .menu-btn{ display:inline-grid; }
  .ideas{ position:fixed; z-index:120; right:0; top:0; bottom:0; width:min(340px, 90vw); box-shadow:var(--shadow); }
  .ideas-toggle-desktop{ display:none; }
}
@media (max-width:700px){
  body{ font-size:15px; }
  .gate{ grid-template-columns:1fr; }
  .gate-art{ padding:calc(28px + var(--safe-t)) 22px 24px; border-right:0; border-bottom:1px solid var(--line-soft); gap:22px; }
  .wordmark{ font-size:64px; }
  .gate-strip{ height:44px; }
  .toolbar{ padding:calc(10px + var(--safe-t)) 14px 10px; gap:8px; align-items:center; flex-wrap:wrap; }
  .period{ order:2; flex-basis:100%; }
  .period h1{ font-size:28px; }
  .rhythm{ max-width:none; margin-top:8px; }
  .tools{ order:1; flex:1; justify-content:space-between; }
  .tools .new-desktop, .tools .label{ display:none; }
  .filters{ padding:10px 14px; }
  .filters .input{ width:100%; }
  .month{ padding:0 8px 12px; }
  .weeks{ grid-auto-rows:minmax(58px, auto); flex:none; }
  .cell{ padding:30px 2px 6px; }
  .cell-head{ top:4px; left:0; right:0; justify-content:center; }
  .alt-tag, .bars, .more{ display:none; }
  .daynum{ font-size:13.5px; min-width:26px; height:24px; }
  .chips{ display:flex; flex-wrap:wrap; justify-content:center; gap:3px; }
  .chip{ width:7px; height:7px; min-height:0; padding:0; border:0; border-radius:50%; background:var(--ch); pointer-events:none; }
  .chip .dot, .chip .t, .chip .tm, .chip::after{ display:none; }
  .agenda{ display:grid; gap:8px; padding:16px 6px 110px; }
  .agenda h3{ margin:0 0 4px; font-size:17px; letter-spacing:-.01em; }
  .weekview{ min-width:0; grid-template-columns:1fr; padding:0 12px 110px; }
  .wcol{ border:0; border-bottom:1px solid var(--line-soft); min-height:0; }
  .wcol:first-child{ border-left:0; }
  .whead{ position:static; border-bottom:0; }
  .addslot{ opacity:1; }
  .year{ grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; padding:12px 12px 110px; }
  .ym{ padding:10px; border-radius:var(--r-md); }
  .ym-title b{ font-size:16px; }
  .yd{ font-size:10.5px; border-radius:4px; }
  .ym-camps{ display:none; }
  .list{ padding:4px 12px 110px; }
  .lrow{ grid-template-columns:62px minmax(0,1fr); }
  .lrow .tm{ display:none; }
  .lrow .right{ grid-column:2; justify-content:flex-start; }
  .kanban{ grid-template-columns:repeat(5, 82vw); overflow-x:auto; scroll-snap-type:x mandatory; padding:12px 12px 110px; }
  .kcol{ scroll-snap-align:start; }
  .modal{ top:auto; bottom:0; left:0; right:0; transform:none; width:100%; max-height:calc(100dvh - var(--safe-t) - 10px); border-radius:var(--r-lg) var(--r-lg) 0 0; padding-bottom:var(--safe-b); animation:sheet .24s var(--ease) both; }
  @keyframes sheet{ from{ transform:translateY(40px); opacity:0; } }
  .grid2{ grid-template-columns:1fr; }
  .modal > footer{ flex-wrap:wrap; }
  .modal > footer .spacer{ flex-basis:100%; height:0; }
  .modal > footer .btn.primary{ flex:1; }
  .modal > footer .btn.ghost.sm{ font-size:0; width:40px; padding:0; gap:0; }
  .modal > footer .btn.ghost.sm svg.i{ width:18px; height:18px; }
  .modal > footer .spacer{ flex-basis:auto; flex:1; }
  .toolbar .seg:not(.views){ display:none; }
  .tabbar{
    display:grid; grid-template-columns:repeat(5,1fr); position:fixed; z-index:90; left:0; right:0; bottom:0;
    padding:6px 6px calc(6px + var(--safe-b)); background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line-soft);
  }
  .tabbar button{ display:grid; justify-items:center; gap:3px; padding:6px 0; color:var(--faint); font-size:11px; font-weight:600; }
  .tabbar button[aria-current="true"]{ color:var(--text); }
  .tabbar button[aria-current="true"] svg{ color:var(--accent-text); }
  .fab{ display:grid; place-items:center; position:fixed; z-index:95; right:16px; bottom:calc(76px + var(--safe-b)); width:54px; height:54px; border-radius:18px; background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow); }
  .fab svg{ width:24px; height:24px; stroke-width:2.2; }
  .toasts{ bottom:calc(140px + var(--safe-b)); }
}

/* ================= V2 ================= */
.chip .t svg.i, .card .ttl svg.i, .tile-date svg.i{ width:12px; height:12px; vertical-align:-1px; margin-right:3px; }
.modal .tabs{ margin-top:-4px; }
.tabs .tabcount{ margin-left:6px; font-size:12px; color:var(--faint); }
[data-pane]{ display:grid; gap:16px; }
/* Validation */
.valbox{ display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:12px 14px; border-radius:var(--r-md); background:var(--surface-2); border:1px solid var(--line-soft); }
.valbox > svg.i{ color:var(--accent-text); }
.valbox b{ display:block; font-size:14.5px; } .valbox span{ color:var(--muted); font-size:13.5px; }
.valbox.locked{ border-color:color-mix(in srgb, var(--st-publie) 45%, var(--line)); }
.valbox.locked > svg.i{ color:var(--st-publie); }
.valbox.review{ grid-template-columns:1fr; }
.steps{ list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.steps li{ display:flex; gap:10px; align-items:center; }
.steps .n{ width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:12.5px; font-weight:700; background:var(--surface-3); color:var(--muted); flex:none; }
.steps li.ok .n{ background:var(--st-publie); color:#0f1a14; }
.steps li.cur .n{ background:var(--st-a_valider); color:#1d1406; }
.steps small{ display:block; color:var(--muted); font-size:12.5px; }
/* Discussion */
.timeline{ display:grid; gap:12px; }
.tl-item{ display:flex; gap:10px; align-items:flex-start; }
.tl-item p{ margin:2px 0 0; font-size:14px; line-height:1.5; overflow-wrap:anywhere; }
.tl-item .ava{ width:28px; height:28px; border-radius:50%; background:var(--surface-3); display:grid; place-items:center; font-size:11.5px; font-weight:700; flex:none; }
.tl-item.ext .ava{ background:color-mix(in srgb, var(--accent) 30%, var(--surface-3)); }
.tl-head{ display:flex; align-items:center; gap:8px; } .tl-head b{ font-size:14px; } .tl-head small, .tl-item small{ color:var(--faint); font-size:12px; }
.tl-del{ margin-left:auto; width:24px; height:24px; display:grid; place-items:center; border-radius:6px; color:var(--faint); }
.tl-del:hover{ background:var(--surface-3); color:var(--text); } .tl-del svg.i{ width:14px; height:14px; }
.tl-item.event{ align-items:center; color:var(--muted); } .tl-item.event p{ margin:0; font-size:13px; color:var(--muted); } .tl-item.event b{ color:var(--text); font-weight:600; }
.tl-dot{ width:28px; display:grid; place-items:center; flex:none; } .tl-dot::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--faint); }
.tl-ico{ width:28px; height:28px; border-radius:50%; display:grid; place-items:center; flex:none; background:var(--surface-3); }
.tl-item.review.approved .tl-ico{ background:color-mix(in srgb, var(--st-publie) 25%, transparent); color:var(--st-publie); }
.tl-item.review.changes .tl-ico{ background:color-mix(in srgb, var(--st-a_valider) 25%, transparent); color:var(--st-a_valider); }
.tl-ico svg.i{ width:15px; height:15px; }
/* Galerie de visuels */
.gallery{ display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px; }
.gthumb{ position:relative; aspect-ratio:1; border-radius:var(--r-sm); overflow:hidden; background:var(--surface-3); }
.gthumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.gthumb .gtools{ position:absolute; inset:auto 4px 4px 4px; display:flex; justify-content:space-between; }
.gthumb .gtools button{ width:26px; height:26px; display:grid; place-items:center; border-radius:6px; background:rgba(10,11,13,.72); color:#fff; }
.gthumb .gtools svg.i{ width:14px; height:14px; }
.gthumb .gidx{ position:absolute; top:4px; left:4px; min-width:20px; height:20px; padding:0 5px; border-radius:5px; background:rgba(10,11,13,.72); color:#fff; font-size:11.5px; font-weight:700; display:grid; place-items:center; }
.gadd{ aspect-ratio:1; border-radius:var(--r-sm); border:1px dashed var(--line); display:grid; place-content:center; justify-items:center; gap:4px; color:var(--muted); font-size:12.5px; font-weight:600; cursor:pointer; text-align:center; padding:6px; }
.gadd:hover{ border-color:var(--faint); color:var(--text); }
img.broken{ opacity:0; }
/* Aperçus plateforme */
.pv-wrap{ display:grid; justify-items:center; padding:6px 0; }
.pv{ width:min(360px, 100%); background:#fff; color:#111; border-radius:14px; overflow:hidden; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size:14px; line-height:1.4; box-shadow:0 0 0 1px rgba(0,0,0,.08); text-align:left; }

      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => { if (!b) return reject(new Error('Image illisible')); b.w = c.width; b.h = c.height; resolve(b); }, 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Ce fichier n’est pas une image lisible.')); };
    img.src = url;
  });
}
const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });

const Remote = {

  async listWorkspaces(){

    const path = `${ws}/${uid()}.jpg`;
    this.ok(await this.sb.storage.from('media').upload(path, blob, { contentType:'image/jpeg', upsert:false }));

  },
  async mediaUrl(path){
    const hit = this.urlCache.get(path); if (hit && hit.exp > Date.now()) return hit.url;
    const d = this.ok(await this.sb.storage.from('media').createSignedUrl(path, 3600));
    this.urlCache.set(path, { url:d.signedUrl, exp:Date.now() + 3300e3 }); return d.signedUrl;
  },
  async removeMedia(path){ try { await this.sb.storage.from('media').remove([path]); } catch (e) {} },
  async mediaUrls(paths){
    const out = {}, need = [];

    if (need.length) {
      const { data, error } = await this.sb.storage.from('media').createSignedUrls(need, 3600);
      if (!error) (data || []).forEach(d => { if (d.signedUrl) { out[d.path] = d.signedUrl; this.urlCache.set(d.path, { url:d.signedUrl, exp:Date.now() + 3300e3 }); } });
    }
    return out;

  async reviewAct(token, post, name, decision, comment){ return this.ok(await this.sb.rpc('review_act', { p_token:token, p_post:post, p_name:name, p_decision:decision || null, p_comment:comment || null })); },
  subscribe(ws, cb){
    const ch = this.sb.channel('ws-' + ws);
    ['posts','campaigns','day_marks','post_comments','post_reviews','media_assets'].forEach(t => ch.on('postgres_changes', { event:'*', schema:'public', table:t, filter:`workspace_id=eq.${ws}` }, () => cb(t)));
    ch.subscribe(); return () => this.sb.removeChannel(ch);
  }
};

  },

  async setApprover(){},
  async setRole(){}, async removeMember(){},
  async loadWorkspace(ws){
    const f = t => clone(this.db[t].filter(x => x.workspace_id === ws));
    return { posts:f('posts'), campaigns:f('campaigns'), marks:f('day_marks'), views:f('saved_views'), assets:f('media_assets').reverse(), links:[] };
  },
  async insert(table, row){
    const r = { id:uid(), created_at:new Date().toISOString(), updated_at:new Date().toISOString(), created_by:this.user.id, ...row };
    if (table === 'saved_views' || table === 'post_comments') r.user_id = this.user.id;
    if (table === 'posts') { r.media_paths = r.media_paths || []; r.locked = !!r.locked; r.review_cycle = r.review_cycle || 0; }
    this.db[table].push(r);
    if (table === 'posts') this.log(r.id, r.workspace_id, 'created', { status:r.status, pub_date:r.pub_date });
    this.save(); return clone(r);
  },
  log(post, ws, kind, detail){ this.db.post_events.push({ id:uid(), post_id:post, workspace_id:ws, user_id:this.user.id, kind, detail, created_at:new Date().toISOString() }); },
  async update(table, id, patch){
    const r = this.db[table].find(x => x.id === id), old = clone(r);
    Object.assign(r, patch, { updated_at:new Date().toISOString() });
    if (table === 'posts') {
      const d = {};
      if (old.status !== r.status) d.status = [old.status, r.status];
      if (old.pub_date !== r.pub_date || old.pub_time !== r.pub_time) d.date = [old.pub_date, old.pub_time, r.pub_date, r.pub_time];
      if (old.locked !== r.locked) d.locked = r.locked;
      if (['title','body','channel','format'].some(k => old[k] !== r[k]) || JSON.stringify(old.media_paths) !== JSON.stringify(r.media_paths)) d.content = true;
      if (Object.keys(d).length) this.log(r.id, r.workspace_id, 'updated', d);
    }
    this.save(); return clone(r);
  },

  },

  },

  async addComment(ws, post, body){ return this.insert('post_comments', { workspace_id:ws, post_id:post, body }); },
  async approvePost(post, decision, comment){
    const p = this.db.posts.find(x => x.id === post), w = this.db.workspaces.find(x => x.id === p.workspace_id);
    if (p.status !== 'a_valider') throw new Error('pas_en_validation');
    if (decision === 'changes' && !(comment || '').trim()) throw new Error('commentaire_requis');
    const n = Math.max(1, ((w.settings.validation || {}).steps || []).length);
    const done = this.db.post_reviews.filter(r => r.post_id === post && r.cycle === p.review_cycle && r.decision === 'approved').length;
    this.db.post_reviews.push({ id:uid(), post_id:post, workspace_id:p.workspace_id, cycle:p.review_cycle, step:done + 1, decision, user_id:this.user.id, comment:(comment || '').trim() || null, created_at:new Date().toISOString() });
    let result = 'step';
    if (decision === 'changes') { await this.update('posts', post, { status:'redaction' }); result = 'changes'; }
    else if (done + 1 >= n) { await this.update('posts', post, { status:'programme', locked:true }); result = 'validated'; }
    this.save(); return { result, step:done + 1, steps:n };
  },
  async setLock(post, locked){ const p = this.db.posts.find(x => x.id === post); await this.update('posts', post, locked ? { locked:true } : { locked:false, status:p.status === 'publie' ? 'publie' : 'redaction' }); },
  async reviewGet(){ throw new Error('Les liens de validation nécessitent la version en ligne.'); },
  async reviewAct(){ throw new Error('Les liens de validation nécessitent la version en ligne.'); },
  subscribe(){ return () => {}; }
};

function inkFor(hex){
  let h = (hex || '#000').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 > .55 ? '#17181B' : '#FFFFFF';
}
function applyPrefs(){

/* ============================================================
   Écrans d'accès
   ============================================================ */
const presetMap = new Map(presetRows('x').map(r => [r.day, r.type]));
function gateArt(){
  const H = { formation:'100%', examen:'82%', entreprise:'54%', ferie:'30%' };
  const bars = []; let d = new Date(2026, 7, 31);
  while (d < new Date(2027, 5, 7)) {
    const cnt = {}; for (let i = 0; i < 7; i++) { const t = presetMap.get(iso(addDays(d, i))); if (t) cnt[t] = (cnt[t] || 0) + 1; }
    const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
    bars.push(top ? top[0] : null); d = addDays(d, 7);
  }
  return `<div class="gate-art">
    <div><h1 class="wordmark">Cadence</h1><p>Le calendrier éditorial de la classe. Chacun planifie ses contenus sur l’année, au rythme de l’alternance.</p></div>

async function boot(){
  S.prefs = loadLocalPrefs(); applyPrefs();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  let cfg = null;
  if (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY) cfg = { mode:'remote', url:CONFIG.SUPABASE_URL, key:CONFIG.SUPABASE_ANON_KEY };
  else { try { cfg = JSON.parse(localStorage.getItem(LS.cfg) || 'null'); } catch (e) {} }
  const reviewToken = new URLSearchParams(location.search).get('v');
  if (reviewToken && cfg && cfg.mode === 'remote') {
    try { S.be = Remote; await Remote.init(cfg.url, cfg.key); return renderReview(reviewToken); }
    catch (e) { $('#root').innerHTML = `<div class="gate"><div class="gate-form" style="grid-column:1/-1"><div class="gate-card"><h2>Lien indisponible</h2><p class="sub">${esc(errMsg(e))}</p></div></div></div>`; return; }
  }
  if (!cfg) return renderSetup();
  /* Lire le retour d'un lien email avant que Supabase ne nettoie l'adresse */
  const hp = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  S.recovering = hp.get('type') === 'recovery';
  const linkErr = hp.get('error_code') || hp.get('error');
  try {
    if (cfg.mode === 'local') { S.be = Local; await Local.init(); S.user = Local.user; return enterApp(); }
    S.be = Remote; await Remote.init(cfg.url, cfg.key);
    Remote.onAuth((ev, user) => {
      if (ev === 'PASSWORD_RECOVERY') { S.entered = false; return renderAuth('newpass'); }
      if (ev === 'SIGNED_OUT') { S.user = null; S.entered = false; stopSub(); renderAuth('login'); }
      if (ev === 'SIGNED_IN' && user && !S.entered && !S.recovering) { S.user = user; enterApp(); }
    });
    if (linkErr || S.recovering) history.replaceState(null, '', location.pathname);
    if (S.recovering && Remote.user) return renderAuth('newpass');
    if (linkErr && !Remote.user) return renderAuth('login', /expired|otp|invalid/i.test(linkErr + hp.get('error_description'))
      ? 'Ce lien n’est plus valable : il a déjà été utilisé ou a expiré. Ouvre le dernier email reçu (Gmail range les emails du même sujet dans une seule conversation), ou redemande un lien.'
      : 'Le lien reçu par email n’a pas fonctionné. Redemande-en un.');
    if (Remote.user) { S.user = Remote.user; await enterApp(); } else renderAuth('login');
  } catch (e) {
    if (CONFIG.SUPABASE_URL) $('#root').innerHTML = `<div class="gate">${gateArt()}<div class="gate-form"><div class="gate-card"><h2>Connexion impossible</h2><p class="sub">${esc(errMsg(e))}</p><button class="btn primary" onclick="location.reload()">Réessayer</button></div></div></div>`;
    else renderSetup(errMsg(e));
  }
}
async function enterApp(){
  if (S.entered) return; S.entered = true;
  $('#root').innerHTML = `<div class="gate"><div class="gate-form" style="grid-column:1/-1"><p class="muted">Chargement de ton calendrier…</p></div></div>`;
  try {
    S.profile = await S.be.getProfile();
    S.prefs = { ...DEFAULT_PREFS, ...loadLocalPrefs(), ...(S.profile.settings || {}) };
    localStorage.setItem(LS.prefs, JSON.stringify(S.prefs)); applyPrefs();
    S.view = S.prefs.view || 'month';
    S.ideasOpen = narrow() ? false : S.prefs.ideasOpen !== false;

    $('#root').innerHTML = `<div class="gate"><div class="gate-form" style="grid-column:1/-1"><div class="gate-card"><h2>Impossible d’ouvrir ton calendrier</h2><p class="sub">${esc(errMsg(e))}</p><button class="btn primary" onclick="location.reload()">Réessayer</button><button class="btn ghost" id="bail">Se déconnecter</button></div></div></div>`;

}
async function loadWorkspaces(prefer){
  S.workspaces = (await S.be.listWorkspaces()).sort((a, b) => (a.kind === 'personal' ? -1 : b.kind === 'personal' ? 1 : a.name.localeCompare(b.name, 'fr')));
  if (!S.workspaces.length) throw new Error('Aucun espace trouvé pour ce compte. Vérifie que schema.sql a bien été exécuté (déclencheur de création de compte).');
  const w = S.workspaces.find(x => x.id === prefer) || S.workspaces[0];
  await openWorkspace(w.id, false);
}
function stopSub(){ if (S.unsub) { try { S.unsub(); } catch (e) {} S.unsub = null; } }
async function openWorkspace(id, render = true){
  const w = S.workspaces.find(x => x.id === id); if (!w) return;
  w.settings = { ...clone(DEFAULT_WS_SETTINGS), ...(w.settings || {}) };
  if (!Array.isArray(w.settings.channels) || !w.settings.channels.length) w.settings.channels = clone(DEFAULT_WS_SETTINGS.channels);
  S.ws = w; S.role = w.role;
  const d = await S.be.loadWorkspace(id);
  S.posts = d.posts; S.campaigns = d.campaigns; S.marks = new Map(d.marks.map(m => [m.day, m.type])); S.views = d.views;
  S.assets = d.assets || []; S.links = d.links || [];
  S.posts.forEach(p => { if (!p.media_paths) p.media_paths = p.media_path ? [p.media_path] : []; });
  try { S.members = await S.be.listMembers(id); } catch (e) { S.members = []; }
  S.me = S.members.find(m => m.user_id === S.user.id) || { role:w.role, can_approve:w.can_approve };
  S.filters = emptyFilters(); S.activeView = ''; S.gridChannel = '';
  stopSub();
  const refresh = debounce(refreshWs, 500);
  S.unsub = S.be.subscribe(id, t => { if ((t === 'post_comments' || t === 'post_reviews') && S.openPostId) reloadThread(); refresh(); });
  if (S.prefs.lastWs !== id) setPref('lastWs', id);
  if (render) renderAll();
}
async function refreshWs(){
  if (!S.ws) return;

    S.posts = d.posts; S.campaigns = d.campaigns; S.marks = new Map(d.marks.map(m => [m.day, m.type]));
    S.assets = d.assets || S.assets; S.links = d.links || S.links;

}

const chan = id => (S.ws.settings.channels.find(c => c.id === id)) || { id, name:id ? id : 'Sans canal', color:'#8E93A3' };
function passes(p){
  const f = S.filters;
  if (f.channels.length && !f.channels.includes(p.channel)) return false;
  if (f.statuses.length && !f.statuses.includes(p.status)) return false;
  if (f.labels.length && !f.labels.some(l => (p.labels || []).includes(l))) return false;
  if (f.campaign && p.campaign_id !== f.campaign) return false;
  if (f.q) { const q = f.q.toLowerCase(); if (!`${p.title || ''} ${p.body || ''} ${p.notes || ''} ${(p.labels || []).join(' ')}`.toLowerCase().includes(q)) return false; }
  return true;
}
const visible = () => S.posts.filter(passes);
const sortPosts = (a, b) => (a.pub_date || '9').localeCompare(b.pub_date || '9') || (a.pub_time || '99').localeCompare(b.pub_time || '99') || (a.created_at || '').localeCompare(b.created_at || '');
function byDate(){
  const m = new Map();
  for (const p of visible()) if (p.pub_date) { if (!m.has(p.pub_date)) m.set(p.pub_date, []); m.get(p.pub_date).push(p); }
  for (const v of m.values()) v.sort(sortPosts);
  return m;
}

/* ---------- Éléments réutilisables ---------- */
function chipHTML(p){
  const c = chan(p.channel);
  return `<button class="chip st-${p.status}" style="--ch:${esc(c.color)}" data-drag="${p.id}" data-action="open-post" data-id="${p.id}" title="${esc((p.title || 'Sans titre') + ', ' + c.name + ', ' + statusName(p.status))}"><span class="dot"></span><span class="t">${p.locked ? I('lock') : ''}${p.pub_time ? `<span class="tm">${fmtTime(p.pub_time)}</span> ` : ''}${esc(p.title || 'Sans titre')}</span></button>`;
}
function cardHTML(p, o = {}){
  const c = chan(p.channel), camp = S.campaigns.find(x => x.id === p.campaign_id);
  return `<button class="card st-${p.status}" style="--ch:${esc(c.color)}" data-drag="${p.id}" data-action="open-post" data-id="${p.id}">
    <span class="top"><span class="dot" style="--c:${esc(c.color)}"></span>${esc(c.name)}${o.showDate ? `<span class="faint">${p.pub_date ? fmtShort(p.pub_date) : 'Sans date'}</span>` : ''}${p.pub_time ? `<span>${fmtTime(p.pub_time)}</span>` : ''}<span class="fmt">${esc(p.format || '')}</span></span>
    <span class="ttl">${p.locked ? I('lock') + ' ' : ''}${esc(p.title || 'Sans titre')}</span>
    <span class="meta"><span class="pill status-pill"><span class="dot"></span>${statusName(p.status)}</span>${camp ? `<span class="pill"><span class="dot" style="--c:${esc(camp.color)}"></span>${esc(camp.name)}</span>` : ''}${(p.labels || []).slice(0, 3).map(l => `<span class="pill">${esc(l)}</span>`).join('')}</span>
  </button>`;
}
function weekBars(days){
  const a = days[0], b = days[6];
  const cs = S.campaigns.filter(c => c.start_date <= b && c.end_date >= a && (!S.filters.campaign || S.filters.campaign === c.id))
    .sort((x, y) => x.start_date.localeCompare(y.start_date) || y.end_date.localeCompare(x.end_date));
  const ends = []; let html = '';
  for (const c of cs) {
    const s = c.start_date >= a ? days.indexOf(c.start_date) : 0, e = c.end_date <= b ? days.indexOf(c.end_date) : 6;
    let lane = ends.findIndex(x => x < s); if (lane < 0) { lane = ends.length; ends.push(e); } else ends[lane] = e;
    if (lane > 2) continue;
    html += `<button class="bar ${c.kind} ${c.start_date < a ? 'cont-l' : ''} ${c.end_date > b ? 'cont-r' : ''}" style="grid-column:${s + 1}/${e + 2};grid-row:${lane + 1};--c:${esc(c.color)}" data-action="edit-campaign" data-id="${c.id}" title="${esc(c.name)}">${esc(c.name)}</button>`;
  }
  return { bars:html, lanes:Math.min(ends.length, 3) };
}
function agendaHTML(d){
  const ps = (byDate().get(d) || []), alt = S.marks.get(d);
  return `<div class="row" style="justify-content:space-between;align-items:center"><h3>${fmtDay(d)}</h3>${alt && S.prefs.showAlt ? `<span class="pill alt-${alt}"><span class="dot" style="--c:var(--altc)"></span>${altName(alt)}</span>` : ''}</div>
    ${ps.length ? ps.map(p => cardHTML(p)).join('') : `<p class="muted" style="margin:0">Rien de prévu ce jour.</p>`}
    <div class="row">${canEdit() ? `<button class="btn sm primary" data-action="new-post" data-date="${d}">${I('plus')}Ajouter un contenu</button><button class="btn sm" data-action="day-menu" data-date="${d}">Type de journée</button>` : ''}</div>`;
}

/* ---------- Vue mois ---------- */
function viewMonth(){
  const y = S.cursor.getFullYear(), m = S.cursor.getMonth();
  const start = startOfWeek(new Date(y, m, 1)), end = addDays(startOfWeek(new Date(y, m + 1, 0)), 6);
  const map = byDate(), today = todayISO(), max = S.prefs.density === 'compact' ? 3 : 4;
  let html = `<div class="month ${altOn() ? '' : 'no-alt'}"><div class="dow">${DOW.map(d => `<span>${d}</span>`).join('')}</div><div class="weeks">`;
  for (let w = start; w <= end; w = addDays(w, 7)) {
    const days = [...Array(7)].map((_, i) => iso(addDays(w, i)));
    const { bars, lanes } = weekBars(days);
    html += `<div class="week" style="--lanes:${lanes}">`;
    for (const d of days) {
      const dt = parseISO(d), alt = S.marks.get(d), ps = map.get(d) || [];
      html += `<div class="cell ${alt ? 'alt-' + alt : ''} ${dt.getMonth() !== m ? 'out' : ''} ${d === today ? 'today' : ''} ${d === S.sel ? 'sel' : ''}" data-drop="date" data-date="${d}" data-action="select-day">
        <div class="cell-head"><button class="daynum" data-action="day-menu" data-date="${d}" aria-label="Options du ${fmtDay(d)}">${dt.getDate()}</button>${alt ? `<span class="alt-tag">${altName(alt)}</span>` : ''}</div>
        <div class="chips">${ps.slice(0, max).map(chipHTML).join('')}${ps.length > max ? `<button class="more" data-action="day-list" data-date="${d}">+${ps.length - max} autres</button>` : ''}</div>
      </div>`;
    }
    html += `<div class="bars">${bars}</div></div>`;
  }
  const sel = S.sel && parseISO(S.sel).getMonth() === m && parseISO(S.sel).getFullYear() === y ? S.sel : iso(new Date(y, m, 1));
  html += `</div><div class="agenda">${agendaHTML(sel)}</div></div>`;
  return html;
}
/* ---------- Vue semaine ---------- */

  const start = startOfWeek(S.cursor), map = byDate(), today = todayISO();

    const d = iso(addDays(start, i)), dt = parseISO(d), alt = S.marks.get(d), ps = map.get(d) || [];
    const camps = S.campaigns.filter(c => inRange(d, c.start_date, c.end_date) && (!S.filters.campaign || S.filters.campaign === c.id));

      <header class="whead"><div class="d"><b>${dt.getDate()}</b><span>${cap(dt.toLocaleDateString('fr-FR', { weekday:'long' }))}</span></div>${alt ? `<span class="alt-tag">${altName(alt)}</span>` : '<span class="alt-tag">&nbsp;</span>'}</header>
      ${camps.length ? `<div class="wbars">${camps.map(c => `<button class="bar ${c.kind} ${c.start_date < d ? 'cont-l' : ''} ${c.end_date > d ? 'cont-r' : ''}" style="--c:${esc(c.color)}" data-action="edit-campaign" data-id="${c.id}">${esc(c.name)}</button>`).join('')}</div>` : ''}
      <div class="wlist">${ps.map(p => cardHTML(p)).join('')}${canEdit() ? `<button class="addslot" data-action="new-post" data-date="${d}">Ajouter</button>` : ''}</div>

/* ---------- Vue année ---------- */
function yearStart(){
  const c = S.cursor;
  return S.prefs.yearMode === 'school' ? new Date(c.getMonth() >= 8 ? c.getFullYear() : c.getFullYear() - 1, 8, 1) : new Date(c.getFullYear(), 0, 1);
}
function viewYear(){
  const base = yearStart(), map = byDate(), today = todayISO(), now = new Date();
  let html = `<div class="year ${altOn() ? '' : 'no-alt'}">`;
  for (let i = 0; i < 12; i++) {
    const md = addMonths(base, i), y = md.getFullYear(), m = md.getMonth(), days = monthDays(y, m);
    const off = (md.getDay() + 6) % 7, a = days[0], b = days[days.length - 1];
    const total = days.reduce((n, d) => n + (map.get(d) || []).length, 0);
    const form = days.filter(d => S.marks.get(d) === 'formation').length;
    const camps = S.campaigns.filter(c => c.start_date <= b && c.end_date >= a);
    html += `<section class="ym ${y === now.getFullYear() && m === now.getMonth() ? 'current' : ''}">
      <button class="ym-title" data-action="goto-month" data-y="${y}" data-m="${m}"><b>${cap(MONTHS[m])}</b><span>${y}</span></button>
      ${rhythmHTML(days)}
      <div class="ym-grid">${DOW1.map(d => `<span class="h">${d}</span>`).join('')}${'<span></span>'.repeat(off)}${days.map(d => {
        const n = (map.get(d) || []).length, alt = S.marks.get(d);
        return `<button class="yd ${alt ? 'alt-' + alt : ''} ${n ? 'has' : ''} ${d === today ? 'today' : ''}" data-action="goto-day" data-date="${d}" aria-label="${fmtDay(d)}, ${n} contenu${n > 1 ? 's' : ''}"><span>${parseISO(d).getDate()}</span>${n ? `<span class="n">${'<i></i>'.repeat(Math.min(n, 3))}</span>` : ''}</button>`;
      }).join('')}</div>
      ${camps.length ? `<div class="ym-camps">${camps.map(c => `<button class="pill" data-action="edit-campaign" data-id="${c.id}"><span class="dot" style="--c:${esc(c.color)}"></span>${esc(c.name)}</button>`).join('')}</div>` : ''}
      <div class="ym-foot"><span>${total ? total + ' contenu' + (total > 1 ? 's' : '') : 'Aucun contenu'}</span>${form && altOn() ? `<span>${form} j de formation</span>` : ''}</div>
    </section>`;
  }
  return html + '</div>';
}

function openModal({ title, body, footer = '', wide = false, onMount }){
  closePopover();
  const root = $('#modal-root');
  root.innerHTML = `<div class="scrim" data-action="close-modal"></div><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header><h2>${esc(title)}</h2><button class="icon-btn" data-action="close-modal" aria-label="Fermer">${I('x')}</button></header>
    <div class="modal-body">${body}</div>${footer ? `<footer>${footer}</footer>` : ''}</div>`;
  S.lastFocus = document.activeElement;
  const m = $('.modal', root); onMount && onMount(m);
  const first = m.querySelector('input:not([type=hidden]):not([disabled]), textarea, select, button.primary'); if (first && !mobile() && first.offsetParent) first.focus({ preventScroll:true });
  return m;
}
function closeModal(){ $('#modal-root').innerHTML = ''; S.openPostId = null; closePicker?.(); S.lastFocus?.focus?.(); }
function openPopover(anchor, html, onMount){
  closePopover();
  const p = document.createElement('div'); p.className = 'popover'; p.setAttribute('role', 'menu'); p.innerHTML = html; document.body.appendChild(p);
  const r = anchor.getBoundingClientRect(), pw = p.offsetWidth, ph = p.offsetHeight;
  let left = Math.min(Math.max(8, r.left), innerWidth - pw - 8), top = r.bottom + 6;
  if (top + ph > innerHeight - 8) top = Math.max(8, r.top - ph - 6);
  p.style.left = left + 'px'; p.style.top = top + 'px'; S.popAnchor = anchor;
  onMount && onMount(p);
}
function closePopover(){ $('.popover')?.remove(); S.popAnchor = null; }

    ${ex ? `<p class="meta-line">${n} contenu${n > 1 ? 's' : ''} rattaché${n > 1 ? 's' : ''} à cette campagne.</p>` : ''}
  </form>`,
  footer:`${ex ? `<button class="btn ghost sm" id="camp-filter">${I('filter')}Voir ses contenus</button>` : ''}${ex && canEdit() ? `<button class="btn ghost sm" id="camp-share">${I('share')}Lien de validation</button>` : ''}${ex && !ro ? `<button class="btn ghost danger sm" id="camp-del">${I('trash')}Supprimer</button>` : ''}<span class="spacer"></span><button class="btn" data-action="close-modal">${ro ? 'Fermer' : 'Annuler'}</button>${ro ? '' : `<button class="btn primary" id="camp-save">${ex ? 'Enregistrer' : 'Créer la campagne'}</button>`}`,

      const f = new FormData(form), name = (f.get('name') || '').trim(), s = f.get('start_date'), e = f.get('end_date');

/* ============================================================
   Glisser-déposer (souris et tactile)
   Souris : on glisse directement. Tactile : appui long puis glisser.
   ============================================================ */
const DnD = {
  st:null, suppress:false,
  init(){
    document.addEventListener('pointerdown', e => this.down(e));
    window.addEventListener('pointermove', e => this.move(e), { passive:true });
    window.addEventListener('pointerup', e => this.up(e));
    window.addEventListener('pointercancel', () => this.cleanup());
    document.addEventListener('touchmove', e => { if (this.st && this.st.active) e.preventDefault(); }, { passive:false });
    document.addEventListener('contextmenu', e => { if (e.target.closest('[data-drag]')) e.preventDefault(); });
  },
  down(e){
    if (e.button > 0 || !canEdit()) return;
    const el = e.target.closest('[data-drag]'); if (!el || el.closest('.modal, .picker')) return;
    const post = S.posts.find(x => x.id === el.dataset.drag); if (post && post.locked && !canApprove()) return;
    this.st = { el, id:el.dataset.drag, x:e.clientX, y:e.clientY, cx:e.clientX, cy:e.clientY, type:e.pointerType, active:false, timer:null, target:null };
    if (e.pointerType !== 'mouse') this.st.timer = setTimeout(() => this.st && this.begin(), 380);
  },
  move(e){
    const s = this.st; if (!s) return;
    s.cx = e.clientX; s.cy = e.clientY;
    if (!s.active) {
      const dist = Math.hypot(s.cx - s.x, s.cy - s.y);
      if (s.type === 'mouse') { if (dist > 6) this.begin(); else return; }
      else { if (dist > 10) this.cleanup(); return; }
    }
    this.place(); this.hover();
  },
  begin(){
    const s = this.st; s.active = true; clearTimeout(s.timer);
    if (s.type !== 'mouse') navigator.vibrate?.(12);
    const r = s.el.getBoundingClientRect(), g = s.el.cloneNode(true);
    g.classList.add('drag-ghost'); g.style.width = Math.min(r.width, 280) + 'px'; g.removeAttribute('data-drag'); document.body.appendChild(g);
    s.ghost = g; s.ox = Math.min(s.x - r.left, 260); s.oy = s.y - r.top;
    s.el.classList.add('dragging'); document.body.classList.add('is-dragging'); closePopover(); this.place(); this.hover();
  },
  place(){ const s = this.st; if (s.ghost) s.ghost.style.transform = `translate(${s.cx - s.ox}px, ${s.cy - s.oy}px) rotate(-1.5deg)`; },
  hover(){
    const s = this.st, t = document.elementFromPoint(s.cx, s.cy)?.closest('[data-drop]') || null;
    if (t !== s.target) { s.target?.classList.remove('drop-over'); t?.classList.add('drop-over'); s.target = t; }
  },
  async up(e){
    const s = this.st; if (!s) return; clearTimeout(s.timer);
    if (!s.active) { this.st = null; return; }
    s.cx = e.clientX; s.cy = e.clientY; this.hover();
    const t = s.target, id = s.id; this.cleanup();
    this.suppress = true; setTimeout(() => this.suppress = false, 60);
    if (t) await onDrop(id, t);
  },
  cleanup(){
    const s = this.st; if (!s) return; clearTimeout(s.timer);
    s.ghost?.remove(); s.el.classList.remove('dragging'); s.target?.classList.remove('drop-over');
    document.body.classList.remove('is-dragging'); this.st = null;
  }
};
async function onDrop(id, t){
  const p = S.posts.find(x => x.id === id); if (!p) return;
  const k = t.dataset.drop; let patch = null;
  if (k === 'date' && p.pub_date !== t.dataset.date) patch = { pub_date:t.dataset.date };
  if (k === 'status' && p.status !== t.dataset.status) patch = { status:t.dataset.status };
  if (k === 'ideas' && p.pub_date) patch = { pub_date:null, pub_time:null };
  if (k === 'swap') return swapPosts(id, t.dataset.id);
  if (!patch) return;
  const old = { ...p }; Object.assign(p, patch); renderAll();
  try {
    Object.assign(p, await S.be.update('posts', id, patch));
    toast(k === 'ideas' ? 'Renvoyé dans la boîte à idées' : k === 'status' ? `Statut : ${statusName(patch.status)}` : `Déplacé au ${fmtShort(patch.pub_date)}`);
  } catch (e) { Object.assign(p, old); renderAll(); toast(errMsg(e), 'err'); }
}

   ============================================================ */
function setView(v){ S.view = v; setPref('view', v); S.sideOpen = false; closePopover(); renderAll(); $('#view')?.scrollTo(0, 0); }
function shift(dir){
  if (S.view === 'year') S.cursor = addMonths(S.cursor, 12 * dir);
  else if (S.view === 'week') S.cursor = addDays(S.cursor, 7 * dir);
  else S.cursor = addMonths(S.cursor, dir);
  renderToolbar(); renderView();
}
document.addEventListener('click', async e => {
  if (DnD.suppress) { e.preventDefault(); e.stopPropagation(); return; }
  const pop = $('.popover');
  if (pop && !pop.contains(e.target) && !(S.popAnchor && S.popAnchor.contains(e.target))) closePopover();
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action, d = el.dataset;
  if (el.tagName === 'A') e.preventDefault();
  switch (a) {
    case 'demo': localStorage.setItem(LS.cfg, JSON.stringify({ mode:'local' })); location.reload(); break;
    case 'close-modal': closeModal(); break;
    case 'changelog': openChangelog(); break;
    case 'toggle-side': S.sideOpen = !S.sideOpen; syncPanels(); break;
    case 'close-panels': S.sideOpen = false; if (narrow()) S.ideasOpen = false; renderIdeas(); syncPanels(); break;
    case 'set-view': setView(d.view); break;
    case 'prev': shift(-1); break;
    case 'next': shift(1); break;
    case 'today': S.cursor = new Date(); S.sel = todayISO(); renderToolbar(); renderView(); break;
    case 'year-mode': setPref('yearMode', d.mode); renderToolbar(); renderView(); break;
    case 'toggle-filters': S.filtersOpen = !S.filtersOpen; renderToolbar(); renderFilters(); if (S.filtersOpen) $('#filters [data-filter="q"]')?.focus(); break;
    case 'toggle-ideas': S.ideasOpen = !S.ideasOpen; if (!narrow()) setPref('ideasOpen', S.ideasOpen); S.sideOpen = false; renderAll(); break;
    case 'toggle-alt': setPref('showAlt', !S.prefs.showAlt); renderAll(); break;
    case 'new-post': if (!canEdit()) return; closeModal(); openPost(null, { date:d.date }); break;
    case 'open-post': openPost(d.id); break;
    case 'day-list': closePopover(); openDayList(d.date); break;
    case 'select-day':
      if (e.target.closest('.chip, .bar, .more, .daynum')) return;
      S.sel = d.date; $$('.cell.sel').forEach(c => c.classList.remove('sel')); el.classList.add('sel');
      const ag = $('.agenda'); if (ag) ag.innerHTML = agendaHTML(d.date);
      break;
    case 'day-menu': {
      if (S.popAnchor === el) return closePopover();
      const cur = S.marks.get(d.date), n = (byDate().get(d.date) || []).length;
      openPopover(el, `<div class="phead">${fmtDay(d.date)}</div>
        ${canEdit() ? `<button class="pitem" data-action="new-post" data-date="${d.date}">${I('plus')}Nouveau contenu</button>` : ''}
        ${n ? `<button class="pitem" data-action="day-list" data-date="${d.date}">${I('list')}Voir ${n > 1 ? 'les ' + n + ' contenus' : 'le contenu'}</button>` : ''}
        ${canEdit() ? `<button class="pitem" data-action="new-campaign" data-date="${d.date}">${I('flag')}Campagne à partir de ce jour</button><hr><div class="phead">Type de journée</div>${ALT_TYPES.map(t => `<button class="pitem" role="menuitemradio" aria-checked="${cur === t.id}" data-action="set-mark" data-date="${d.date}" data-type="${t.id}"><span class="dot" style="--c:var(--alt-${t.id})"></span>${t.name}</button>`).join('')}<button class="pitem" role="menuitemradio" aria-checked="${!cur}" data-action="set-mark" data-date="${d.date}" data-type="">Aucun</button>` : ''}`);
      break;
    }
    case 'set-mark': {
      closePopover(); const prev = S.marks.get(d.date);
      d.type ? S.marks.set(d.date, d.type) : S.marks.delete(d.date); renderAll();
      try { await S.be.setDayMark(S.ws.id, d.date, d.type || null); } catch (err) { prev ? S.marks.set(d.date, prev) : S.marks.delete(d.date); renderAll(); toast(errMsg(err), 'err'); }
      break;
    }
    case 'goto-month': S.cursor = new Date(+d.y, +d.m, 1); setView('month'); break;
    case 'goto-day': S.cursor = parseISO(d.date); S.sel = d.date; setView('month'); break;
    case 'edit-campaign': closePopover(); openCampaign(d.id); break;
    case 'new-campaign': closePopover(); openCampaign(null, { date:d.date }); break;
    case 'campaigns': openCampaigns(); break;
    case 'ws-menu': if (S.popAnchor === el) return closePopover(); wsMenu(el); break;
    case 'switch-ws': closePopover(); S.sideOpen = false; if (d.id !== S.ws.id) { try { await openWorkspace(d.id); } catch (err) { toast(errMsg(err), 'err'); } } else syncPanels(); break;
    case 'new-ws': closePopover(); openNewWs(); break;
    case 'join-ws': closePopover(); openJoinWs(); break;
    case 'ws-settings': closePopover(); S.sideOpen = false; syncPanels(); openWsSettings(d.tab || 'general'); break;
    case 'settings': S.sideOpen = false; syncPanels(); openSettings(); break;
    case 'f-channel': case 'f-status': {
      const key = a === 'f-channel' ? 'channels' : 'statuses', arr = S.filters[key];
      S.filters[key] = arr.includes(d.id) ? arr.filter(x => x !== d.id) : [...arr, d.id]; S.activeView = '';
      renderFilters(); renderToolbar(); renderView(); renderIdeas(); break;
    }
    case 'f-reset': S.filters = emptyFilters(); S.activeView = ''; renderAll(); break;
    case 'save-view': {
      const name = prompt('Nom de la vue (ex. Instagram à valider)'); if (!name || !name.trim()) return;
      try { const v = await S.be.insert('saved_views', { workspace_id:S.ws.id, name:name.trim(), filters:{ ...S.filters, view:S.view } }); S.views.push(v); S.activeView = v.id; renderFilters(); toast('Vue enregistrée'); }
      catch (err) { toast(errMsg(err), 'err'); }
      break;
    }
    case 'del-view': {
      const v = S.views.find(x => x.id === S.activeView); if (!v || !confirm(`Supprimer la vue « ${v.name} » ?`)) return;
      try { await S.be.remove('saved_views', v.id); S.views = S.views.filter(x => x.id !== v.id); S.activeView = ''; renderFilters(); toast('Vue supprimée'); } catch (err) { toast(errMsg(err), 'err'); }
      break;
    }
  }
});
